/* ---------------- library ---------------- */
const lib={db:null,items:[],first:true};
function localLib(){try{return JSON.parse(localStorage.getItem('circuit.library')||'{}')||{};}catch(_){return {};}}
function writeLocalLib(o){try{localStorage.setItem('circuit.library',JSON.stringify(o));}catch(_){}}
function docBody(){
  const d=state.doc,p=focusPath(),b=p&&bake(p);
  const o={name:d.name,width:d.width,race:JSON.parse(JSON.stringify(d.race||defaultRace())),paths:JSON.parse(JSON.stringify(d.paths)),updatedAt:Date.now(),lapLength:b?Math.round(b.total):0};
  if(d.hasRef) o.hasRef=true;
  return o;
}
let saveT=0;
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(saveNow,700);}
function saveNow(){
  if(state.doc.example) return;
  const body=docBody(),id=state.doc.id;
  try{localStorage.setItem('circuit.current',JSON.stringify({id,...body}));}catch(_){}
  if(lib.db){
    lib.db.collection('tracks').doc(id).set(body).catch(err=>{
      if(err&&err.code==='quota_exceeded') toast('Your track library is full. Delete a track to save new ones.');
      else toast('Couldn’t save to your library. Your changes are kept in this browser.');
    });
  }else{const o=localLib();o[id]=body;writeLocalLib(o);lib.items=Object.entries(o).map(([k,v])=>({id:k,...v})).sort((a,b)=>b.updatedAt-a.updatedAt);renderLib();}
}
function loadDoc(doc,fitView,ref){
  if(!doc.race) doc.race=defaultRace();
  state.doc=doc;
  if(ref) setRef(doc.id,ref); else loadRefFor(doc);
  state.sel={path:null,nodes:new Set(),piece:null};
  state.penPath=null;state.ruler=null;state.wsel=null;
  syncDocInputs(); resetHistory();
  if(fitView) requestAnimationFrame(fit); else render();
  renderLib();
}
function openItem(it){
  if(state.dirty) commit();
  clearTimeout(saveT); if(!state.doc.example) saveNow();
  loadDoc(docFrom(it,it.id),true);
  closeLib();
}
function newTrack(){
  clearTimeout(saveT); if(!state.doc.example) saveNow();
  loadDoc(blankDoc(),false);
  state.view.z=0.6; const r=stage.getBoundingClientRect(); state.view.tx=r.width/2; state.view.ty=r.height/2;
  setTool('pen'); closeLib(); $('trackName').focus(); $('trackName').select();
}
async function deleteItem(id){
  if(lib.db){try{await lib.db.collection('tracks').doc(id).delete();}catch(_){toast('Couldn’t delete that track. Try again.');return;}}
  else{const o=localLib();delete o[id];writeLocalLib(o);lib.items=lib.items.filter(i=>i.id!==id);}
  refDel(id);
  if(id===state.doc.id){
    const next=lib.items.find(i=>i.id!==id);
    if(next) openItem(next); else loadDoc(blankDoc(),false);
  }
  renderLib();
}
function relTime(t){
  const s=(Date.now()-t)/1000;
  if(s<60) return 'just now'; if(s<3600) return Math.round(s/60)+' min ago'; if(s<86400) return Math.round(s/3600)+' h ago';
  return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
}
let armed=null;
function renderLib(){
  const list=$('libList'); if(!list) return;
  const items=lib.items.slice();
  if(!state.doc.example&&!items.find(i=>i.id===state.doc.id)) items.unshift({id:state.doc.id,name:state.doc.name,updatedAt:Date.now(),lapLength:0,unsaved:true});
  if(!items.length){list.innerHTML='<div class="lib-foot">No saved tracks yet. Edit the example or start a new track and it saves automatically.</div>';}
  else list.innerHTML=items.map(it=>`<div class="lrow${it.id===state.doc.id?' cur':''}"><button class="open" data-open="${esc(it.id)}"><b>${esc(it.id===state.doc.id?state.doc.name:(it.name||'Untitled circuit'))}</b><span>${it.lapLength?(it.lapLength/1000).toFixed(3)+' km · ':''}${it.unsaved?'not saved yet':relTime(it.updatedAt)}</span></button>${it.unsaved?'':`<button class="del${armed===it.id?' arm':''}" data-del="${esc(it.id)}">${armed===it.id?'Confirm delete':'Delete'}</button>`}</div>`).join('');
  $('libFoot').textContent=lib.db?'Tracks save automatically to this page’s library.':'Tracks save automatically in this browser.';
}
$('libList').addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'),d=e.target.closest('[data-del]');
  if(o){const it=lib.items.find(i=>i.id===o.dataset.open);if(it&&it.id!==state.doc.id) openItem(it); else closeLib();return;}
  if(d){const id=d.dataset.del;if(armed===id){armed=null;deleteItem(id);}else{armed=id;renderLib();}}
});
$('libBtn').addEventListener('click',e=>{e.stopPropagation();const l=$('lib');const open=l.hidden;l.hidden=!open;$('libBtn').setAttribute('aria-expanded',String(open));armed=null;renderLib();});
$('newBtn').addEventListener('click',newTrack);
function closeLib(){const l=$('lib');if(l&&!l.hidden){l.hidden=true;$('libBtn').setAttribute('aria-expanded','false');armed=null;}}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.lib')&&!e.target.closest('#libBtn')) closeLib();});

async function initCapabilities(){
  const c=window.claude;
  if(!c||!c.use) return;
  try{downloads=await c.use('downloads');}catch(_){downloads=null;}
  try{lib.db=await c.use('db');}catch(_){lib.db=null;}
  if(!lib.db){initLocalLib();return;}
  lib.db.collection('tracks').orderBy('updatedAt','desc').limit(500).onSnapshot(snap=>{
    lib.items=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(lib.first&&!snap.metadata.fromCache){
      lib.first=false;
      const untouched=hist.i===0&&!state.drag;
      const top=lib.items[0];
      if(untouched&&top&&(state.doc.example||top.id===state.doc.id&&top.updatedAt>(state.doc.updatedAt||0))) openItem(top);
    }
    renderLib();
  },()=>{lib.db=null;initLocalLib();});
}
function initLocalLib(){
  const o=localLib();
  lib.items=Object.entries(o).map(([k,v])=>({id:k,...v})).sort((a,b)=>b.updatedAt-a.updatedAt);
  renderLib();
}

/* ---------------- boot ---------------- */
(function boot(){
  let doc=null;
  try{
    const cur=JSON.parse(localStorage.getItem('circuit.current')||'null');
    if(cur&&Array.isArray(cur.paths)) doc=docFrom(cur,cur.id);
  }catch(_){}
  if(!doc){doc=exampleDoc();}
  state.doc=doc; syncDocInputs(); resetHistory(); loadRefFor(doc);
  setTool('pen');
  if(doc.paths.length===1) state.sel={path:doc.paths[0].id,nodes:new Set(),piece:null};
  requestAnimationFrame(()=>{fit();});
  initLocalLib();
  initCapabilities();
})();

})();
</script>
</body>
</html>
