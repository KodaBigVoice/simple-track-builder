});
$('segList').addEventListener('change',e=>{if(e.target.classList.contains('tname')&&state.dirty) commit();});
$('segList').addEventListener('keydown',e=>{if(e.target.classList.contains('tname')&&e.key==='Enter') e.target.blur();});
$('segList').addEventListener('click',e=>{
  const r=e.target.closest('.srow'); if(!r) return;
  const k=+r.dataset.k,pid=r.dataset.p;
  if(state.sel.path===pid&&state.sel.piece===k) state.sel.piece=null;
  else state.sel={path:pid,nodes:new Set(),piece:k};
  render();
});
$('widthIn').addEventListener('input',e=>{const v=parseFloat(e.target.value);if(isFinite(v)&&v>=1&&v<=100){state.doc.width=v;markDirty();render();}});
$('widthIn').addEventListener('change',()=>{if(state.dirty) commit();});
$('trackName').addEventListener('input',e=>{state.doc.name=e.target.value||'Untitled circuit';markDirty();});
$('trackName').addEventListener('change',()=>{if(state.dirty) commit();renderLib();});
function syncDocInputs(){$('trackName').value=state.doc.name;$('widthIn').value=state.doc.width;}

/* ---------------- toolbar ---------------- */
function setTool(t){
  if(t!==state.tool) state.penPath=null;
  state.tool=t;
  if(t!=='measure') {}
  document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===t)));
  if((t==='round'||t==='direct'||t==='pen'||t==='arc')&&!state.sel.path){const fp=state.doc.paths.length===1?state.doc.paths[0]:null;if(fp&&t!=='pen') state.sel={path:fp.id,nodes:new Set(),piece:null};}
  state.hover=null; ctxKey=''; updateCursor(); render();
}
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
$('undoBtn').addEventListener('click',undo);
$('redoBtn').addEventListener('click',redo);
$('zoomIn').addEventListener('click',()=>zoomCenter(1.25));
$('zoomOut').addEventListener('click',()=>zoomCenter(0.8));
$('fitBtn').addEventListener('click',fit);
$('snapBtn').addEventListener('click',()=>{state.snap=!state.snap;$('snapBtn').setAttribute('aria-pressed',String(state.snap));});

/* theme */
const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>';
const MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>';
const mq=window.matchMedia('(prefers-color-scheme: dark)');
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':mq.matches;}
function paintThemeBtn(){const d=isDark(),b=$('themeBtn');b.innerHTML=d?SUN:MOON;const l=d?'Switch to light mode':'Switch to dark mode';b.setAttribute('aria-label',l);b.title=l;}
$('themeBtn').addEventListener('click',()=>{const next=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('circuit.theme',next);}catch(_){}paintThemeBtn();render();});
try{const t=localStorage.getItem('circuit.theme');if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t);}catch(_){}
if(mq.addEventListener) mq.addEventListener('change',paintThemeBtn);
paintThemeBtn();

/* ---------------- input wiring ---------------- */
stage.addEventListener('pointerdown',onDown);
stage.addEventListener('pointermove',onMove);
stage.addEventListener('pointerup',onUp);
stage.addEventListener('pointercancel',onUp);
stage.addEventListener('pointerleave',()=>{if(!state.drag){state.cursorS=null;state.hover=null;render();}});
stage.addEventListener('contextmenu',e=>e.preventDefault());
stage.addEventListener('dblclick',e=>{
  if(state.tool==='select'){const hp=hitPiece(ptr(e));if(hp){state.sel={path:hp.path.id,nodes:new Set(),piece:null};setTool('direct');}}
});
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  const sp=ptr(e),dy=e.deltaMode===1?e.deltaY*33:e.deltaY,dx=e.deltaMode===1?e.deltaX*33:e.deltaX;
  const zoomish=e.ctrlKey||e.metaKey||(e.deltaX===0&&Number.isInteger(e.deltaY)&&Math.abs(dy)>=50);
  if(zoomish) zoomAt(sp,Math.exp(-dy*(e.ctrlKey||e.metaKey?0.01:0.0015)));
  else{state.view.tx-=dx;state.view.ty-=dy;}
  render();
},{passive:false});

window.addEventListener('keydown',e=>{
  const tag=e.target&&e.target.tagName;
  const typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if(typing&&e.key==='Enter'&&(e.target.id==='lineLen'||e.target.id==='lineAng')){e.preventDefault();lineAddTyped();setTimeout(()=>{const el=$(e.target.id);if(el){el.focus();el.select();}},0);return;}
  if(typing){if(e.key==='Escape'||(e.key==='Enter'&&e.target.classList.contains('name'))) e.target.blur();return;}
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
  if(mod&&e.key==='0'){e.preventDefault();fit();return;}
  if(mod&&(e.key==='='||e.key==='+')){e.preventDefault();zoomCenter(1.25);return;}
  if(mod&&e.key==='-'){e.preventDefault();zoomCenter(0.8);return;}
  if(e.key==='Control'||e.key==='Meta'){state.mod=true;ctxKey='';updateCursor();render();return;}
  if(e.key==='Alt'){state.alt=true;if(state.cursorS) updateHover(state.cursorS);render();return;}
  if(e.key===' '){e.preventDefault();if(!state.space){state.space=true;updateCursor();render();}return;}
  if(mod) return;
  if(e.target&&e.target.closest&&e.target.closest('.lib')) return;
  const map={v:'select',a:'direct',p:'pen',l:'line',r:'arc',c:'round',x:'split',t:'race',m:'measure'};
  const k=e.key.toLowerCase();
  if(map[k]&&!e.altKey){setTool(map[k]);return;}
  if(e.key==='Escape'||e.key==='Enter'){
    if(state.penPath){state.penPath=null;}
    else if(e.key==='Escape'){if(state.ruler) state.ruler=null; else {state.sel.nodes=new Set();state.sel.piece=null;}}
    closeLib(); render(); return;
  }
  if(e.key==='Delete'||e.key==='Backspace'){
    e.preventDefault();
    const s=selPath(); if(!s) return;
    const t=effTool();
    if(t==='round'){for(const j of state.sel.nodes) s.nodes[j].r=0;commit();render();return;}
    if(t!=='select'&&state.sel.nodes.size){
      deleteNodes(s,state.sel.nodes);
      if(state.penPath&&!getPath(state.penPath)) state.penPath=null;
      commit();render();return;
    }
    state.doc.paths=state.doc.paths.filter(p=>p!==s);
    state.sel={path:null,nodes:new Set(),piece:null};state.penPath=null;commit();render();return;
  }
  if(e.key.startsWith('Arrow')){
    const s=selPath(); if(!s) return;
    e.preventDefault();
    const st=e.shiftKey?10:1,d={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
    const idx=state.sel.nodes.size&&effTool()!=='select'?[...state.sel.nodes]:s.nodes.map((_,i)=>i);
    idx.forEach(i=>s.nodes[i]&&moveNode(s.nodes[i],d));
    commit();render();return;
  }
  if(e.key==='='||e.key==='+'){zoomCenter(1.25);return;}
  if(e.key==='-'){zoomCenter(0.8);return;}
});
window.addEventListener('keyup',e=>{
  if(e.key===' '){state.space=false;updateCursor();render();}
  if(e.key==='Control'||e.key==='Meta'){state.mod=false;ctxKey='';updateCursor();render();}
  if(e.key==='Alt'){state.alt=false;if(state.cursorS) updateHover(state.cursorS);render();}
});
window.addEventListener('blur',()=>{state.space=false;state.mod=false;state.alt=false;});
new ResizeObserver(()=>render()).observe(wrap);

/* ---------------- toast ---------------- */
let toastT=0;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3600);}

/* ---------------- export & files ---------------- */
let downloads=null;
function slug(n){return (n||'circuit').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'circuit';}
function raceSVG(W){
  const R=state.race,r=state.doc.race; if(!R) return '';
  const f=q=>(+q[0].toFixed(2))+' '+(+q[1].toFixed(2));
  const across=(sv,id)=>{const at=lineAt(R.line,sv),nn=[-at.tan[1],at.tan[0]],a=V.add(at.pt,V.mul(nn,W/2)),c=V.sub(at.pt,V.mul(nn,W/2));const t=R.rev?V.mul(at.tan,-1):at.tan;return `    <line id="${id}" x1="${f(a).split(' ')[0]}" y1="${f(a).split(' ')[1]}" x2="${f(c).split(' ')[0]}" y2="${f(c).split(' ')[1]}" data-distance="${R.dist(R.s0,sv).toFixed(1)}" data-heading="${f(t)}"/>\n`;};
  let out='';
  if(r.start) out+=`  <g id="start-finish" stroke="#FFFFFF" stroke-width="1">\n${across(R.s0,'start')}  </g>\n`;
  if(R.sectors){const ord=R.sectors.slice().sort((a,c)=>R.dist(R.s0,a)-R.dist(R.s0,c));out+=`  <g id="sectors" stroke="#1D5FD1" stroke-width="1">\n${ord.map((sv,i)=>across(sv,'sector-'+(i+2))).join('')}  </g>\n`;}
  if(R.turns.length) out+=`  <g id="turns" font-family="sans-serif" font-size="${Math.max(8,W)}" font-weight="700" fill="#111111" text-anchor="middle">\n${R.turns.map(t=>{const q=V.add(t.pt,V.mul(t.out,W*1.6));return `    <text x="${q[0].toFixed(1)}" y="${q[1].toFixed(1)}">${esc(t.name||'T'+t.n)}</text>\n`;}).join('')}  </g>\n`;
  return out;
}
function buildSVG(){
  const doc=state.doc,W=doc.width;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity,body='',cl='',lap=0;
  const bakes=doc.paths.map(p=>({p,b:bake(p)})).filter(o=>o.p.nodes.length>=2);
  for(const {p,b} of bakes){
    for(const pc of b.pieces) for(const q of samplePiece(pc)){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1]);}
    const d=piecesD(b.pieces,p.closed);
    body+=`    <path d="${d}"/>\n`; cl+=`    <path d="${d}"/>\n`;
    if(p.closed&&!lap) lap=b.total;
  }
  if(!isFinite(x0)) return null;
  const m=W/2+10,vx=+(x0-m).toFixed(2),vy=+(y0-m).toFixed(2),vw=+(x1-x0+2*m).toFixed(2),vh=+(y1-y0+2*m).toFixed(2);
  return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${vw}" height="${vh}" viewBox="${vx} ${vy} ${vw} ${vh}">
  <title>${esc(doc.name)}</title>
  <desc>Scale: 1 unit = 1 metre. Track width ${W} m.${lap?' Lap length '+lap.toFixed(1)+' m.':''} ${state.race&&state.race.closed?' Runs '+(state.race.clockwise?'clockwise':'anticlockwise')+'.':''} Drawn in Circuit Track Editor.</desc>
  <g id="track" fill="none" stroke="#111111" stroke-width="${W}" stroke-linejoin="round" stroke-linecap="round">
${body}  </g>
  <g id="centreline" fill="none" stroke="#D4231A" stroke-width="0.5">
${cl}  </g>
${raceSVG(W)}</svg>
`;
}
async function offer(filename,data,label){
  if(!downloads&&!window.claude){
    const ext=filename.split('.').pop(),url=URL.createObjectURL(new Blob([data],{type:ext==='svg'?'image/svg+xml':'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);return;
  }
  if(!downloads){
    try{await navigator.clipboard.writeText(data);toast('Downloads aren’t available here, so the '+label+' was copied to your clipboard.');}
    catch(_){toast('Downloads aren’t available in this view.');}
    return;
  }
  try{await downloads.save({filename,data});}
  catch(err){
    const c=err&&err.code;
    if(c==='declined') return;
    if(c==='rate_limited'){toast('A save prompt is already open.');return;}
    toast('That file couldn’t be saved here.');
  }
}
$('exportBtn').addEventListener('click',()=>{
  const svg=buildSVG();
  if(!svg){toast('Draw a track first, then export it.');return;}
  offer(slug(state.doc.name)+'.svg',svg,'SVG');
});
$('saveFileBtn').addEventListener('click',()=>{
  const d=state.doc;
  offer(slug(d.name)+'.json',JSON.stringify({format:'circuit-track',version:2,name:d.name,width:d.width,race:d.race,paths:d.paths},null,1),'track file');
});
$('openFileBtn').addEventListener('click',()=>$('fileIn').click());
$('fileIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value='';
  if(!f) return;
  try{
    const j=JSON.parse(await f.text());
    if(!j||!Array.isArray(j.paths)) throw new Error('bad');
    const doc=docFrom({...j,name:j.name||f.name.replace(/\.json$/i,'')});
    loadDoc(doc,true); scheduleSave(); toast('Opened '+doc.name+'.');
  }catch(_){toast('That file isn’t a Circuit track. Choose a .json file saved from this editor.');}
});
function cleanPath(p){
  if(!p||!Array.isArray(p.nodes)) return null;
  const pt=a=>Array.isArray(a)&&a.length===2&&isFinite(a[0])&&isFinite(a[1])?[+a[0],+a[1]]:null;
  const nodes=p.nodes.filter(n=>n&&isFinite(n.x)&&isFinite(n.y)).map(n=>({x:+n.x,y:+n.y,hi:pt(n.hi),ho:pt(n.ho),smooth:!!n.smooth,r:Math.max(0,+n.r||0)}));
  if(!nodes.length) return null;
  return {id:typeof p.id==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(p.id)?p.id:uid(),closed:!!p.closed&&nodes.length>=3,nodes};
}
function docFrom(o,id){
  return {id:id||uid(),name:String(o.name||'Untitled circuit').slice(0,120),width:+o.width||12,updatedAt:o.updatedAt||0,race:cleanRace(o.race),paths:(Array.isArray(o.paths)?o.paths:[]).map(cleanPath).filter(Boolean)};
}

/* ---------------- library ---------------- */
const lib={db:null,items:[],first:true};
function localLib(){try{return JSON.parse(localStorage.getItem('circuit.library')||'{}')||{};}catch(_){return {};}}
function writeLocalLib(o){try{localStorage.setItem('circuit.library',JSON.stringify(o));}catch(_){}}
function docBody(){
  const d=state.doc,p=focusPath(),b=p&&bake(p);
  return {name:d.name,width:d.width,race:JSON.parse(JSON.stringify(d.race||defaultRace())),paths:JSON.parse(JSON.stringify(d.paths)),updatedAt:Date.now(),lapLength:b?Math.round(b.total):0};
}
let saveT=0;
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(saveNow,700);}
function saveNow(){
  if(state.doc.example) return;
  const body=docBody(),id=state.doc.id;
  try{localStorage.setItem('circuit.current',JSON.stringify({id,...body}));}catch(_){}
  if(lib.db){
    lib.db.collection('tracks').doc(id).set(body).catch(err=>{
      if(err&&err.code==='quota_exceeded') toast('Your track library is full. Delete a track to save new ones.');
      else toast('Couldn’t save to your library. Your changes are kept in this browser.');
    });
  }else{const o=localLib();o[id]=body;writeLocalLib(o);lib.items=Object.entries(o).map(([k,v])=>({id:k,...v})).sort((a,b)=>b.updatedAt-a.updatedAt);renderLib();}
}
function loadDoc(doc,fitView){
  if(!doc.race) doc.race=defaultRace();
  state.doc=doc;
  state.sel={path:null,nodes:new Set(),piece:null};
  state.penPath=null;state.ruler=null;
  syncDocInputs(); resetHistory();
  if(fitView) requestAnimationFrame(fit); else render();
  renderLib();
}
function openItem(it){
  if(state.dirty) commit();
  clearTimeout(saveT); if(!state.doc.example) saveNow();
  loadDoc(docFrom(it,it.id),true);
  closeLib();
}
function newTrack(){
  clearTimeout(saveT); if(!state.doc.example) saveNow();
  loadDoc(blankDoc(),false);
  state.view.z=0.6; const r=stage.getBoundingClientRect(); state.view.tx=r.width/2; state.view.ty=r.height/2;
  setTool('pen'); closeLib(); $('trackName').focus(); $('trackName').select();
}
async function deleteItem(id){
  if(lib.db){try{await lib.db.collection('tracks').doc(id).delete();}catch(_){toast('Couldn’t delete that track. Try again.');return;}}
  else{const o=localLib();delete o[id];writeLocalLib(o);lib.items=lib.items.filter(i=>i.id!==id);}
  if(id===state.doc.id){
    const next=lib.items.find(i=>i.id!==id);
    if(next) openItem(next); else loadDoc(blankDoc(),false);
  }
  renderLib();
}
function relTime(t){
  const s=(Date.now()-t)/1000;
  if(s<60) return 'just now'; if(s<3600) return Math.round(s/60)+' min ago'; if(s<86400) return Math.round(s/3600)+' h ago';
  return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
}
let armed=null;
function renderLib(){
  const list=$('libList'); if(!list) return;
  const items=lib.items.slice();
  if(!state.doc.example&&!items.find(i=>i.id===state.doc.id)) items.unshift({id:state.doc.id,name:state.doc.name,updatedAt:Date.now(),lapLength:0,unsaved:true});
  if(!items.length){list.innerHTML='<div class="lib-foot">No saved tracks yet. Edit the example or start a new track and it saves automatically.</div>';}
  else list.innerHTML=items.map(it=>`<div class="lrow${it.id===state.doc.id?' cur':''}"><button class="open" data-open="${esc(it.id)}"><b>${esc(it.id===state.doc.id?state.doc.name:(it.name||'Untitled circuit'))}</b><span>${it.lapLength?(it.lapLength/1000).toFixed(3)+' km · ':''}${it.unsaved?'not saved yet':relTime(it.updatedAt)}</span></button>${it.unsaved?'':`<button class="del${armed===it.id?' arm':''}" data-del="${esc(it.id)}">${armed===it.id?'Confirm delete':'Delete'}</button>`}</div>`).join('');
  $('libFoot').textContent=lib.db?'Tracks save automatically to this page’s library.':'Tracks save automatically in this browser.';
}
$('libList').addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'),d=e.target.closest('[data-del]');
  if(o){const it=lib.items.find(i=>i.id===o.dataset.open);if(it&&it.id!==state.doc.id) openItem(it); else closeLib();return;}
  if(d){const id=d.dataset.del;if(armed===id){armed=null;deleteItem(id);}else{armed=id;renderLib();}}
});
$('libBtn').addEventListener('click',e=>{e.stopPropagation();const l=$('lib');const open=l.hidden;l.hidden=!open;$('libBtn').setAttribute('aria-expanded',String(open));armed=null;renderLib();});
$('newBtn').addEventListener('click',newTrack);
function closeLib(){const l=$('lib');if(l&&!l.hidden){l.hidden=true;$('libBtn').setAttribute('aria-expanded','false');armed=null;}}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.lib')&&!e.target.closest('#libBtn')) closeLib();});

async function initCapabilities(){
  const c=window.claude;
  if(!c||!c.use) return;
  try{downloads=await c.use('downloads');}catch(_){downloads=null;}
  try{lib.db=await c.use('db');}catch(_){lib.db=null;}
  if(!lib.db){initLocalLib();return;}
  lib.db.collection('tracks').orderBy('updatedAt','desc').limit(500).onSnapshot(snap=>{
    lib.items=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(lib.first&&!snap.metadata.fromCache){
      lib.first=false;
      const untouched=hist.i===0&&!state.drag;
      const top=lib.items[0];
      if(untouched&&top&&(state.doc.example||top.id===state.doc.id&&top.updatedAt>(state.doc.updatedAt||0))) openItem(top);
    }
    renderLib();
  },()=>{lib.db=null;initLocalLib();});
}
function initLocalLib(){
  const o=localLib();
  lib.items=Object.entries(o).map(([k,v])=>({id:k,...v})).sort((a,b)=>b.updatedAt-a.updatedAt);
  renderLib();
}

/* ---------------- boot ---------------- */
(function boot(){
  let doc=null;
  try{
    const cur=JSON.parse(localStorage.getItem('circuit.current')||'null');
    if(cur&&Array.isArray(cur.paths)) doc=docFrom(cur,cur.id);
  }catch(_){}
  if(!doc){doc=exampleDoc();}
  state.doc=doc; syncDocInputs(); resetHistory();
  setTool('pen');
  if(doc.paths.length===1) state.sel={path:doc.paths[0].id,nodes:new Set(),piece:null};
  requestAnimationFrame(()=>{fit();});
  initLocalLib();
  initCapabilities();
})();

})();
</script>
