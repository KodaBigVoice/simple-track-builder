<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A metre-scaled path editor for designing racing circuits.">
<style>body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Circuit Track Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drawing area left (toolbar, canvas, status), circuit panel right; panel stacks under the canvas on phones. */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --canvas:#F5F5F3; --ink:#121212; --muted:#5C5C5A;
  --line:#E4E4E1; --grid-minor:#ECECE9; --grid-major:#D9D9D5; --hover:#F1F1EE;
  --accent:#D4231A; --on-accent:#FFFFFF; --warn:#B45309; --sector:#1D5FD1;
  --f-sans:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E0F; --panel:#111112; --canvas:#18181A; --ink:#F2F2F0; --muted:#A3A3A0;
    --line:#2A2A2D; --grid-minor:#202023; --grid-major:#2E2E32; --hover:#1F1F22;
    --warn:#FBBF24; --sector:#2F6FE0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E0F; --panel:#111112; --canvas:#18181A; --ink:#F2F2F0; --muted:#A3A3A0;
  --line:#2A2A2D; --grid-minor:#202023; --grid-major:#2E2E32; --hover:#1F1F22;
  --warn:#FBBF24; --sector:#2F6FE0; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:flex;height:100%}
.work{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}

/* toolbar */
.toolbar{height:60px;flex-shrink:0;display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tb{height:44px;min-width:44px;padding:0 12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border-bottom:2px solid transparent;color:var(--ink)}
.tb:hover{background:var(--hover)}
.tb[aria-pressed="true"]{border-bottom-color:var(--accent);font-weight:600}
.tb:disabled{opacity:.32;cursor:default;background:transparent}
.tb .key{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tb svg{flex-shrink:0}
.tb.icon{padding:0}
.sep{width:1px;height:24px;background:var(--line);margin:0 8px;flex-shrink:0}
.grow{flex:1 1 8px}
.zoom{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:52px;text-align:center}
.bordered{border:1px solid var(--line);border-bottom:1px solid var(--line)}
.tb.export{background:var(--ink);color:var(--bg);font-weight:600;margin-left:8px;padding:0 14px;border-bottom:0;height:40px}
.tb.export:hover{opacity:.9;background:var(--ink)}
@media (max-width:1400px){ .tb .lbl{display:none} .tb{padding:0 10px} }
@media (max-width:560px){ .tb.export span{display:none} }

/* stage */
.stage-wrap{flex:1 1 auto;min-height:0;position:relative;background:var(--canvas);overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.scalebar{position:absolute;left:20px;bottom:44px;display:flex;align-items:flex-end;gap:10px;font-family:var(--f-mono);font-size:11px;color:var(--ink);pointer-events:none}
.scalebar .bar{display:flex;height:6px}
.scalebar .bar i{display:block;height:6px;box-sizing:border-box;border:1px solid var(--ink)}
.scalebar .bar i:first-child{background:var(--ink)}
.scalebar .bar i:last-child{background:var(--canvas)}
.status{position:absolute;left:0;right:0;bottom:0;height:32px;display:flex;align-items:center;gap:16px;padding:0 16px;font-size:12px;color:var(--muted);
  background:color-mix(in srgb,var(--canvas) 88%,transparent);border-top:1px solid var(--line)}
.status .hint{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.snap{border:1px solid var(--line);background:var(--bg);height:22px;padding:0 8px;font-size:11px;color:var(--muted)}
.snap[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.empty{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;max-width:360px;line-height:1.5}
.empty strong{display:block;color:var(--ink);font-size:18px;font-weight:600;margin-bottom:6px}

/* svg classes */
.g1{fill:none;stroke:var(--grid-minor);stroke-width:1}
.g2{fill:none;stroke:var(--grid-major);stroke-width:1}
.trk{fill:none;stroke:var(--ink);stroke-linejoin:round;stroke-linecap:round}
.trk.hl{stroke:var(--accent)}
.trk.wn{stroke:var(--warn)}
.dot{fill:var(--ink)}
.cl{fill:none;stroke:#FFFFFF;stroke-width:1;vector-effect:non-scaling-stroke}
.hov{fill:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.anc{fill:var(--canvas);stroke:var(--accent);stroke-width:1.2}
.anc.on{fill:var(--accent)}
.hl-line{stroke:var(--accent);stroke-width:1;fill:none}
.hdl{fill:var(--canvas);stroke:var(--accent);stroke-width:1.2}
.rb{fill:none;stroke:var(--accent);stroke-width:1}
.mq{fill:var(--accent);fill-opacity:.07;stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3}
.wdg{fill:var(--canvas);stroke:var(--accent);stroke-width:1.6}
.wdg.on{fill:var(--accent)}
.ghost{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 4}
.vtx{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
.pill{fill:var(--accent)}
.pill-t{fill:var(--on-accent);font-family:var(--f-mono);font-size:11px}
.glyph{fill:var(--accent);font-family:var(--f-mono);font-size:13px;font-weight:500}
.rul{stroke:var(--accent);stroke-width:1.4;fill:none}
.arw{fill:none;stroke:var(--canvas);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.85}
.chq{fill:var(--canvas)}
.secl{stroke:var(--sector);stroke-width:2.5;vector-effect:non-scaling-stroke}
.pill.sec{fill:var(--sector)}
.pill.ink{fill:var(--ink)}
.pill.ink+text{fill:var(--bg)}
.tlab{font-family:var(--f-sans);font-size:12px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--canvas);stroke-width:4px;stroke-linejoin:round}

/* panel */
.panel{width:320px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;position:relative;
  padding-block:24px 20px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));box-sizing:border-box;gap:22px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px}
.brand .sq{width:14px;height:14px;background:var(--accent);flex-shrink:0}
.brand b{font-weight:800;letter-spacing:.02em}
.libbtn{margin-left:auto;height:32px;padding:0 10px;border:1px solid var(--line);background:transparent;display:flex;align-items:center;gap:6px;font-size:13px}
.libbtn:hover{background:var(--hover)}
.summary{display:flex;flex-direction:column;gap:4px}
.name{border:0;border-bottom:1px solid transparent;background:transparent;padding:2px 0;font-size:13px;color:var(--muted);width:100%}
.name:hover{border-bottom-color:var(--line)}
.name:focus{outline:none;border-bottom-color:var(--accent);color:var(--ink)}
.lap{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.lap small{font-size:22px;font-weight:600;letter-spacing:0}
.sub{font-size:13px;color:var(--muted)}
.ctx{display:flex;flex-direction:column;gap:10px}
.ctx h3,.sect h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ctx p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.ctx ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);line-height:1.4}
.ctx ul b{color:var(--ink);font-weight:600}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field .in{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.num{width:72px;height:32px;border:1px solid var(--line);background:var(--bg);padding:0 8px;text-align:right;font-family:var(--f-mono);font-size:13px;box-sizing:border-box}
.num:focus{outline:none;border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{height:36px;padding:0 14px;border:1px solid var(--ink);background:transparent;font-weight:500;font-size:13px}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.35;cursor:default;background:transparent}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{opacity:.9}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
.big{font-family:var(--f-mono);font-size:30px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--warn)}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.kv span:last-child{color:var(--ink);font-family:var(--f-mono)}

.sect{display:flex;flex-direction:column;gap:10px}
.segs{display:flex;flex-direction:column;min-height:120px}
.segs-head{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:6px;border-bottom:2px solid var(--ink);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.seglist{display:flex;flex-direction:column}
.tabs{display:flex;gap:14px}
.tabs button{border:0;background:transparent;padding:0 0 4px;font:inherit;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-8px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.trow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:5px 0}
.trow .ix{font-family:var(--f-mono);font-size:12px;font-weight:500}
.tname{border:0;border-bottom:1px solid transparent;background:transparent;height:28px;padding:0;font-size:14px;min-width:0;width:100%}
.tname::placeholder{color:var(--muted)}
.tname:hover{border-bottom-color:var(--line)}
.tname:focus{outline:none;border-bottom-color:var(--accent)}
.tmeta{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.srow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 0;font-size:14px}
.srow:hover{background:var(--hover)}
.srow .ix{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.srow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .nm em{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}
.srow .ln{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.srow.on{background:var(--accent);color:var(--on-accent);border-bottom-color:var(--accent);padding-left:8px;padding-right:8px;margin:0 -8px;width:calc(100% + 16px)}
.srow.on .ix,.srow.on .nm em{color:var(--on-accent)}
.srow .tight{color:var(--warn);font-size:12px;margin-left:6px}
.srow.on .tight{color:var(--on-accent)}
.chip{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;padding:0 4px;margin-left:6px;vertical-align:1px}
.segs-empty{padding:12px 0;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}

/* library popover */
.lib{position:absolute;top:64px;left:16px;right:16px;z-index:5;background:var(--panel);border:1px solid var(--ink);box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;flex-direction:column;max-height:70vh}
.lib-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.lib-head h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lib-list{overflow-y:auto}
.lrow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.lrow .open{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.lrow .open:hover{background:var(--hover)}
.lrow .open b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .open span{font-size:12px;color:var(--muted)}
.lrow.cur .open b::before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);margin-right:8px;vertical-align:1px}
.lrow .del{border:0;background:transparent;height:44px;padding:0 14px;font-size:12px;color:var(--muted)}
.lrow .del:hover{color:var(--accent)}
.lrow .del.arm{color:var(--on-accent);background:var(--accent)}
.lib-foot{padding:10px 14px;font-size:12px;color:var(--muted)}
.lib-files{display:flex;gap:8px;padding:12px 14px 0}
.lib-files .btn{flex:1}
.panel>*{flex-shrink:0}

.toast{position:fixed;left:50%;bottom:calc(48px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font-size:13px;z-index:20;max-width:min(520px,calc(100vw - 32px))}

@media (max-width:820px){
  body{overflow:auto}
  .app{flex-direction:column;height:auto;min-height:100%}
  .work{height:72vh;min-height:420px}
  .panel{width:auto;border-left:0;border-top:1px solid var(--line);overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .status .hint{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <div class="work">
    <nav class="toolbar" aria-label="Tools">
      <button class="tb icon" id="undoBtn" aria-label="Undo (Ctrl+Z)" title="Undo  Ctrl+Z">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
      </button>
      <button class="tb icon" id="redoBtn" aria-label="Redo (Ctrl+Shift+Z)" title="Redo  Ctrl+Shift+Z">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 0 0 0 12h3"></path></svg>
      </button>
      <div class="sep"></div>
      <button class="tb" data-tool="select" title="Select  V"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3l13 8-6 1.5L10 19z"></path></svg><span class="lbl">Select</span><span class="key">V</span></button>
      <button class="tb" data-tool="direct" title="Direct select  A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l13 8-6 1.5L10 19z"></path></svg><span class="lbl">Direct</span><span class="key">A</span></button>
      <button class="tb" data-tool="pen" title="Pen  P"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l6 10-6 9-6-9z"></path><path d="M12 12v9"></path><circle cx="12" cy="11" r="1.4"></circle></svg><span class="lbl">Pen</span><span class="key">P</span></button>
      <button class="tb" data-tool="line" title="Straight line  L"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 19L19 5"></path><rect x="3" y="17" width="4" height="4" fill="currentColor" stroke="none"></rect><rect x="17" y="3" width="4" height="4" fill="currentColor" stroke="none"></rect></svg><span class="lbl">Line</span><span class="key">L</span></button>
      <button class="tb" data-tool="arc" title="Straights &amp; arcs  R"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 20A16 16 0 0 1 20 4"></path></svg><span class="lbl">Arc</span><span class="key">R</span></button>
      <button class="tb" data-tool="round" title="Round corners  C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 21V12a8 8 0 0 1 8-8h9"></path></svg><span class="lbl">Round</span><span class="key">C</span></button>
      <button class="tb" data-tool="split" title="Split  X"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M8.5 7.5L20 18M8.5 16.5L20 6"></path></svg><span class="lbl">Split</span><span class="key">X</span></button>
      <button class="tb" data-tool="race" title="Race layout  T"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h13l-2.5 4L18 12H5"></path></svg><span class="lbl">Race</span><span class="key">T</span></button>
      <button class="tb" data-tool="measure" title="Measure  M"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="2" y="8" width="20" height="8" rx="1.5"></rect><path d="M6 8v3M10 8v4M14 8v3M18 8v4"></path></svg><span class="lbl">Measure</span><span class="key">M</span></button>
      <div class="grow"></div>
      <button class="tb icon" id="zoomOut" aria-label="Zoom out" title="Zoom out  −"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
      <span class="zoom" id="zoomLbl" aria-live="polite">100%</span>
      <button class="tb icon" id="zoomIn" aria-label="Zoom in" title="Zoom in  +"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
      <button class="tb" id="fitBtn" title="Fit to track  Ctrl+0"><span>Fit</span></button>
      <div class="sep"></div>
      <button class="tb icon bordered" id="themeBtn" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
      <button class="tb export" id="exportBtn" title="Export SVG"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg><span>Export SVG</span></button>
    </nav>
    <div class="stage-wrap" id="stageWrap">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg" role="application" aria-label="Track drawing canvas"></svg>
      <div class="empty" id="emptyMsg" hidden><strong>Start drawing</strong>Choose the Pen and click to place points. Drag as you click to make a curve. Click your first point to close the loop.</div>
      <div class="scalebar" aria-hidden="true"><div class="bar"><i id="sb1"></i><i id="sb2"></i></div><span id="sbLbl">200 m</span></div>
      <div class="status">
        <span class="mono" id="coords">x 0.0 m · y 0.0 m</span>
        <button class="snap" id="snapBtn" aria-pressed="false">Snap to grid</button>
        <span class="hint" id="hint"></span>
      </div>
    </div>
  </div>

  <aside class="panel" aria-label="Circuit">
    <div class="brand">
      <span class="sq" aria-hidden="true"></span><b>CIRCUIT</b>
      <button class="libbtn" id="libBtn" aria-expanded="false" aria-controls="lib">Tracks

<script>
(function(){
'use strict';

/* ---------------- vectors ---------------- */
const V={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1]],

  len:a=>Math.hypot(a[0],a[1]),
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1],

/* ---------------- segment maths (s = {line, P:[p0,p1,p2,p3]}) ---------------- */
function sPoint(s,t){

}
function sDeriv(s,t){

/* ---------------- path model ----------------
   path  {id, closed, nodes:[node]}
   node  {x, y, hi:[x,y]|null, ho:[x,y]|null, smooth:bool, r:metres}
   units are metres, y increases downward (screen convention). */
function segCount(p){const n=p.nodes.length;return n<2?0:(p.closed?n:n-1);}
function rawSeg(p,i){

function bake(p){

      const A=segs[c.inI],B=segs[c.outI];
      const pa=sPoint(A.s,A.t1),pb=sPoint(B.s,B.t0);
      const da=sTan(A.s,A.t1),db=sTan(B.s,B.t0);

}
function piecesD(pieces,closed,from,to){
  from=from||0; to=to==null?pieces.length:to;

  let d='M'+f(pieces[from].parts[0].P[0]);
  for(let k=from;k<to;k++) for(const pt of pieces[k].parts){
    d+=pt.line?' L'+f(pt.P[3]):' C'+f(pt.P[1])+' '+f(pt.P[2])+' '+f(pt.P[3]);
  }

}
function samplePiece(pc){
  const pts=[];
  for(const pt of pc.parts){
    const n=pt.line?1:20;
    for(let i=(pts.length?1:0);i<=n;i++) pts.push(sPoint(pt,i/n));
  }
  return pts;
}

/* ---------------- race layer: everything placed by distance along the race path ---------------- */
function defaultRace(){return {loop:null,reversed:false,start:null,sectors:null,arrows:true,numbers:true,turnMin:15,names:{}};}
function cleanRace(r){
  const d=defaultRace(); if(!r||typeof r!=='object') return d;
  const pt=a=>Array.isArray(a)&&a.length===2&&isFinite(a[0])&&isFinite(a[1])?[+a[0],+a[1]]:null;
  d.loop=typeof r.loop==='string'?r.loop:null; d.reversed=!!r.reversed; d.start=pt(r.start);
  d.sectors=Array.isArray(r.sectors)&&r.sectors.length===2&&pt(r.sectors[0])&&pt(r.sectors[1])?[pt(r.sectors[0]),pt(r.sectors[1])]:null;
  d.arrows=r.arrows!==false; d.numbers=r.numbers!==false; d.turnMin=isFinite(r.turnMin)?clamp(+r.turnMin,1,90):15;
  if(r.names&&typeof r.names==='object') for(const k in r.names) if(typeof r.names[k]==='string'&&r.names[k].trim()) d.names[k]=r.names[k].slice(0,60);
  return d;
}
function buildLine(b,closed){
  const pts=[],cum=[],pk=[];let acc=0;
  b.pieces.forEach(pc=>{
    pk.push(acc);
    samplePiece(pc).forEach((q,i)=>{
      if(pts.length&&i===0) return;
      if(pts.length) acc+=V.dist(pts[pts.length-1],q);
      pts.push(q);cum.push(acc);
    });
  });

}
function lineProject(line,w){
  let best=null,bd=Infinity;
  for(let i=1;i<line.pts.length;i++){
    const a=line.pts[i-1],b=line.pts[i],ab=V.sub(b,a),L2=V.dot(ab,ab);
    const t=L2?clamp(V.dot(V.sub(w,a),ab)/L2,0,1):0,q=V.lerp(a,b,t),d=V.dist(w,q);
    if(d<bd){bd=d;best={s:line.cum[i-1]+t*(line.cum[i]-line.cum[i-1]),pt:q,dist:d};}
  }
  return best||{s:0,pt:line.pts[0]||[0,0],dist:Infinity};
}
function lineAt(line,s){
  const L=line.L; if(line.closed&&L>0) s=((s%L)+L)%L; else s=clamp(s,0,L);

  while(hi-lo>1){const m=(lo+hi)>>1;if(line.cum[m]<=s) lo=m; else hi=m;}
  const a=line.pts[lo],b=line.pts[hi]||a,span=(line.cum[hi]-line.cum[lo])||1;
  return {pt:V.lerp(a,b,(s-line.cum[lo])/span),tan:V.norm(V.sub(b,a))};
}
function lineMod(line,s){const L=line.L;return line.closed&&L>0?((s%L)+L)%L:s;}
function pieceAt(line,s){let k=0;for(let i=0;i<line.pk.length;i++) if(line.pk[i]<=s+1e-6) k=i;return k;}

  if(pc._ang!=null) return pc._ang;

  const p=samplePiece(pc);let a=0;

function computeRace(){
  const r=state.doc.race; if(!r) return null;
  const p=(r.loop&&getPath(r.loop))||state.doc.paths.find(q=>q.closed&&q.nodes.length>=3)||null;
  if(!p||p.nodes.length<2) return null;
  const b=state.bakes.get(p.id); if(!b||!b.pieces.length) return null;
  const line=buildLine(b,p.closed),L=line.L,rev=!!r.reversed;
  const s0=r.start?lineProject(line,r.start).s:(rev&&!p.closed?L:0);
  const n=b.pieces.length,k0=pieceAt(line,s0),order=[];
  for(let q=0;q<n;q++) order.push(p.closed?(rev?(k0-q+n)%n:(k0+q)%n):(rev?n-1-q:q));

  for(const k of order){
    const pc=b.pieces[k];let a=pieceAngle(pc);if(rev) a=-a;
    if(pc.line||Math.abs(a)<0.035){if(pc.line&&pc.len<3&&cur) continue;flush();continue;}
    const sg=Math.sign(a);

    if(!cur) cur={sg,ang:0,pieces:[],minR:Infinity,len:0};
    cur.ang+=a;cur.pieces.push(k);cur.minR=Math.min(cur.minR,pc.minR);cur.len+=pc.len;
  }
  flush();
  turns.forEach((t,i)=>{
    t.n=i+1;
    let half=t.len/2,k=t.pieces[0],f=0.5;
    for(const kk of t.pieces){const pl=b.pieces[kk].len;if(half<=pl){k=kk;f=pl?half/pl:0.5;break;}half-=pl;}
    if(rev) f=1-f;
    const segL=(k+1<line.pk.length?line.pk[k+1]:L)-line.pk[k];

  let sectorLens=null;
  if(sectors&&p.closed){
    const sorted=[s0,...sectors].map(x=>dist(s0,x)).sort((a,c)=>a-c);
    sectorLens=[sorted[1]-sorted[0],sorted[2]-sorted[1],L-sorted[2]];
  }
  return {p,b,line,L,s0,rev,order,turns,closed:p.closed,cwGeo,clockwise:p.closed?(cwGeo!==rev):null,sectors,sectorLens,dist};
}
function snapRaceMarks(){
  const R=state.race,r=state.doc.race; if(!R||!r) return;
  if(r.start) r.start=lineProject(R.line,r.start).pt;
  if(r.sectors) r.sectors=r.sectors.map(q=>lineProject(R.line,q).pt);
}

/* ---------------- example circuit ---------------- */
function exampleDoc(){
  const raw=[[0,0,40],[800,0,60],[860,-180,35],[600,-260,50],[600,-430,40],[820,-520,30],[760,-640,45],[120,-640,90],[-60,-480,70],[-60,-150,50]];
  const pid=uid(),race=defaultRace();

  return {id:uid(),name:'Example circuit',width:12,example:true,race,paths:[{id:pid,closed:true,nodes:raw.map(r=>({x:r[0],y:r[1],hi:null,ho:null,smooth:false,r:r[2]}))}]};
}
function blankDoc(){return {id:uid(),name:'Untitled circuit',width:12,race:defaultRace(),paths:[]};}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

/* ---------------- state ---------------- */
const state={
  doc:null, view:{z:0.5,tx:0,ty:0}, tool:'pen',
  sel:{path:null,nodes:new Set(),piece:null},
  penPath:null, ruler:null, drag:null, hover:null, cursorS:null,
  space:false, mod:false, alt:false, shift:false, snap:false, dirty:false,
  bakes:new Map(), race:null, listTab:'segs',
  roundR:50, lineLen:100,
  arc:{len:200,r:120,ang:90,dir:'right',heading:0,ghost:'arc'}
};
const stage=document.getElementById('stage');
const wrap=document.getElementById('stageWrap');
const $=id=>document.getElementById(id);

const getPath=id=>state.doc.paths.find(p=>p.id===id)||null;
const selPath=()=>state.sel.path?getPath(state.sel.path):null;

const toS=w=>[w[0]*state.view.z+state.view.tx,w[1]*state.view.z+state.view.ty];
const toW=s=>[(s[0]-state.view.tx)/state.view.z,(s[1]-state.view.ty)/state.view.z];

/* ---------------- history ---------------- */
const hist={stack:[],i:-1};
function resetHistory(){hist.stack=[JSON.stringify(state.doc)];hist.i=0;state.dirty=false;updateUndo();}
function commit(){
  const snap=JSON.stringify(state.doc);
  state.dirty=false;
  if(hist.stack[hist.i]===snap) return;
  hist.stack=hist.stack.slice(0,hist.i+1);
  hist.stack.push(snap);
  if(hist.stack.length>400) hist.stack.shift();
  hist.i=hist.stack.length-1;
  if(state.doc.example){delete state.doc.example;}
  updateUndo(); scheduleSave();
}
function restore(){

/* ---------------- geometry edits ---------------- */
function reversePath(p){p.nodes.reverse();for(const n of p.nodes){const t=n.hi;n.hi=n.ho;n.ho=t;}}

  if(p.nodes.length===0) state.doc.paths=state.doc.paths.filter(q=>q!==p);

function splitAtNode(p,k){

    const first=cp(order[0]),end=cp(order[0]);

function splitTarget(sp){

function moveNode(n,d){n.x+=d[0];n.y+=d[1];if(n.hi)n.hi=V.add(n.hi,d);if(n.ho)n.ho=V.add(n.ho,d);}

function convertSmooth(p,i){

/* ---------------- hit testing (screen px) ---------------- */
function distToPoly(sp,pts){
  let best=Infinity;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],ab=V.sub(b,a),L2=V.dot(ab,ab);
    let t=L2?V.dot(V.sub(sp,a),ab)/L2:0; t=clamp(t,0,1);
    const d=V.dist(sp,V.lerp(a,b,t)); if(d<best) best=d;
  }
  return best;
}
function hitAnchor(sp,p){

  p.nodes.forEach((n,i)=>{const d=V.dist(sp,toS([n.x,n.y]));if(d<=bd){bd=d;best=i;}});
  return best;
}
function hitHandle(sp,p,idxs){
  if(!p) return null;
  for(const i of idxs){
    const n=p.nodes[i]; if(!n) continue;
    for(const w of ['hi','ho']) if(n[w]&&V.dist(sp,toS(n[w]))<=7) return {i,which:w};
  }
  return null;
}
function hitPiece(sp,onlyPath){
  const tol=Math.max(7,state.doc.width*state.view.z/2);
  let best=null,bd=tol;
  const paths=onlyPath?[onlyPath]:state.doc.paths.slice().reverse();
  for(const p of paths){
    const b=state.bakes.get(p.id); if(!b) continue;
    b.pieces.forEach((pc,k)=>{const d=distToPoly(sp,samplePiece(pc).map(toS));if(d<bd){bd=d;best={path:p,k};}});
  }

}
function hitRawSeg(sp,p,tol){
  if(!p) return null;

  for(let i=0;i<segCount(p);i++){
    const s=rawSeg(p,i),N=s.line?24:64;
    let bt=0,bdd=Infinity;
    for(let k=0;k<=N;k++){const d=V.dist(sp,toS(sPoint(s,k/N)));if(d<bdd){bdd=d;bt=k/N;}}
    let lo=Math.max(0,bt-1/N),hi=Math.min(1,bt+1/N);
    for(let it=0;it<20;it++){
      const m1=lo+(hi-lo)/3,m2=hi-(hi-lo)/3;

function cornerWidgetPos(p,c){

/* ---------------- tools ---------------- */
function effTool(e){
  const mod=e?(e.ctrlKey||e.metaKey):state.mod;
  if((state.tool==='pen'||state.tool==='line')&&mod) return 'direct';
  return state.tool;
}
function penAction(sp,lineMode){
  let ap=state.penPath&&getPath(state.penPath);
  if(ap&&ap.closed) ap=null;
  if(ap){
    const h=hitAnchor(sp,ap);
    if(h===0&&ap.nodes.length>=2) return {act:'close',p:ap};
    if(h===ap.nodes.length-1&&h>=0) return {act:lineMode?'none':'lastHandle',p:ap,i:h};
    for(const o of state.doc.paths){
      if(o===ap||o.closed||!o.nodes.length) continue;
      const k=hitAnchor(sp,o);
      if(k===0||k===o.nodes.length-1) return {act:'join',p:ap,o,i:k};
    }
    return {act:'new',p:ap};
  }
  for(const p of state.doc.paths){
    if(p.closed||!p.nodes.length) continue;
    const h=hitAnchor(sp,p);
    if(h===0||h===p.nodes.length-1) return {act:'continue',p,i:h};
  }
  const sp_=selPath();
  if(sp_&&!lineMode){
    const h=hitAnchor(sp_,sp_);
    if(h>=0) return {act:state.alt?'convert':'delete',p:sp_,i:h};
    const hs=hitRawSeg(sp,sp_);

function hitAnchorWrap(sp,p){return hitAnchor(sp,p);}

function onDown(e){

  const sp=ptr(e),wp=toW(sp);
  state.alt=e.altKey; state.shift=e.shiftKey;
  closeLib();
  if(e.button===1||state.space){state.drag={type:'pan',sp0:sp,t0:[state.view.tx,state.view.ty]};updateCursor();return;}
  const tool=effTool(e);
  if(tool==='pen') penDown(sp,wp,e,false);
  else if(tool==='line') penDown(sp,wp,e,true);
  else if(tool==='split') splitDown(sp);
  else if(tool==='race') raceDown(sp,wp,e);
  else if(tool==='direct') directDown(sp,wp,e);
  else if(tool==='select') selectDown(sp,wp,e);
  else if(tool==='round') roundDown(sp,wp,e);
  else if(tool==='arc') arcDown(sp,wp,e);
  else if(tool==='measure') measureDown(sp,wp,e);

function penDown(sp,wp,e,lineMode){
  state.alt=e.altKey;
  const a=penAction(sp,lineMode);
  if(a.act==='none'){state.drag={type:'none'};return;}
  if(a.act==='close'){
    a.p.closed=true; const n0=a.p.nodes[0]; n0.hi=null;
    state.sel={path:a.p.id,nodes:new Set([0]),piece:null};
    state.penPath=null; markDirty();
    if(lineMode){a.p.nodes[a.p.nodes.length-1].ho=null;state.drag={type:'none'};return;}
    state.drag={type:'penHandle',p:a.p,i:0,mode:'close',sp0:sp,moved:false};
    return;
  }
  if(a.act==='join'){
    joinPaths(a.p,a.o,a.i===0,lineMode);

    markDirty(); state.drag={type:'none'}; return;
  }

  }

function splitDown(sp){

  const res=splitAtNode(tg.p,k);

  state.sel={path:res.p.id,nodes:new Set(res.ends),piece:null};
  markDirty();

function raceHandleAt(sp){
  const R=state.race,r=state.doc.race; if(!R) return null;

  if(R.sectors) for(let i=0;i<R.sectors.length;i++) if(V.dist(sp,toS(lineAt(R.line,R.sectors[i]).pt))<=10) return i;

function headingDeg(p){const d=endHeading(p);return Math.round(Math.atan2(-d[1],d[0])*1800/Math.PI)/10;}

function directDown(sp,wp,e){

    state.sel.piece=null;
    if(e.altKey){

function arcDown(sp,wp,e){

}

function onMove(e){
  const sp=ptr(e);
  state.cursorS=sp; state.alt=e.altKey; state.shift=e.shiftKey; state.mod=e.ctrlKey||e.metaKey;
  const d=state.drag;
  if(!d){updateHover(sp);render();return;}
  const wp=toW(sp);
  if(d.type==='pan'){state.view.tx=d.t0[0]+sp[0]-d.sp0[0];state.view.ty=d.t0[1]+sp[1]-d.sp0[1];render();return;}
  if(!d.moved&&d.sp0&&V.dist(sp,d.sp0)<3) {render();return;}
  d.moved=true;
  if(d.type==='penHandle'){
    const nd=d.p.nodes[d.i],a=[nd.x,nd.y];
    if(state.space&&d.mode==='new'){const dd=V.sub(wp,d.lastW||wp);moveNode(nd,dd);d.lastW=wp;render();return;}
    d.lastW=wp;
    let m=wp; if(e.shiftKey) m=constrain45(a,m);
    const mir=V.sub(V.mul(a,2),m);
    if(d.mode==='outOnly'){nd.ho=m;}
    else if(d.mode==='close'){nd.hi=mir;if(!e.altKey){nd.ho=m.slice();nd.smooth=true;}else nd.smooth=false;}
    else if(d.mode==='new'||d.mode==='pull'){
      if(e.altKey){nd.ho=m;nd.smooth=false;if(!nd.hi&&d.mode==='pull') nd.hi=null;}
      else{nd.ho=m;nd.hi=mir;nd.smooth=true;}
    }
    markDirty();
  }else if(d.type==='handle'){
    const nd=d.p.nodes[d.i],a=[nd.x,nd.y];
    let m=wp; if(e.shiftKey) m=constrain45(a,m);
    nd[d.which]=m;
    const other=d.which==='hi'?'ho':'hi';
    if(e.altKey) nd.smooth=false;
    else if(nd.smooth&&nd[other]){
      const L=V.dist(nd[other],a),dir=V.norm(V.sub(a,m));
      if(V.len(dir)) nd[other]=V.add(a,V.mul(dir,L));
    }
    markDirty();
  }else if(d.type==='moveNodes'||d.type==='movePath'){
    let dd=V.sub(wp,d.w0);
    if(e.shiftKey) dd=constrain45([0,0],dd);
    if(state.snap){
      const first=d.type==='movePath'?d.orig[0]:d.orig[Object.keys(d.orig)[0]];
      if(first){const t=snapPt([first.x+dd[0],first.y+dd[1]]);dd=[t[0]-first.x,t[1]-first.y];}
    }
    if(d.type==='movePath'){
      d.p.nodes=d.orig.map(n=>{const c=JSON.parse(JSON.stringify(n));moveNode(c,dd);return c;});
      if(d.race){const r=state.doc.race;if(d.race.start) r.start=V.add(d.race.start,dd);if(d.race.sectors) r.sectors=d.race.sectors.map(q=>V.add(q,dd));}
    }else{
      for(const k in d.orig){const c=JSON.parse(JSON.stringify(d.orig[k]));moveNode(c,dd);d.p.nodes[k]=c;}
    }
    markDirty();
  }else if(d.type==='marquee'){d.sp1=sp;}
  else if(d.type==='raceMark'){
    const R=state.race,r=state.doc.race;
    if(R){const q=lineProject(R.line,wp).pt;if(d.key==='start') r.start=q; else if(r.sectors) r.sectors[d.key]=q;markDirty();}
  }
  else if(d.type==='round'){
    const b=state.bakes.get(d.p.id),c=b&&b.corners[d.j];
    if(c){
      const s=V.dot(V.sub(wp,c.v),c.bis),ch=Math.cos(c.delta/2);
      let R=s>0?s*ch/Math.max(1e-6,1-ch):0;
      R=clamp(R,0,c.maxR);
      if(e.shiftKey) R=Math.round(R/5)*5;
      R=Math.round(R*10)/10;
      for(const j of state.sel.nodes){if(b.corners[j]) d.p.nodes[j].r=Math.min(R,b.corners[j].maxR||R);}
      d.p.nodes[d.j].r=R; d.liveR=R;
      markDirty();
    }
  }else if(d.type==='ruler'){
    let b=snapToAnchor(sp)||snapPt(wp);
    if(e.shiftKey) b=constrain45(state.ruler.a,b);
    state.ruler.b=b;
  }
  render();
}
function onUp(e){
  const d=state.drag; state.drag=null;
  if(d&&d.type==='marquee'&&V.dist(d.sp0,d.sp1)>3){
    const x0=Math.min(d.sp0[0],d.sp1[0]),x1=Math.max(d.sp0[0],d.sp1[0]),y0=Math.min(d.sp0[1],d.sp1[1]),y1=Math.max(d.sp0[1],d.sp1[1]);
    const inside=n=>{const s=toS([n.x,n.y]);return s[0]>=x0&&s[0]<=x1&&s[1]>=y0&&s[1]<=y1;};
    let target=selPath(),hits=[];
    if(target) target.nodes.forEach((n,i)=>{if(inside(n)) hits.push(i);});
    if(!hits.length){
      for(const p of state.doc.paths){const h=[];p.nodes.forEach((n,i)=>{if(inside(n)) h.push(i);});if(h.length){target=p;hits=h;break;}}
    }
    if(hits.length){
      if(state.sel.path!==target.id||!d.additive) state.sel={path:target.id,nodes:new Set(),piece:null};
      hits.forEach(i=>state.sel.nodes.add(i));
    }
  }
  if(state.dirty){if(state.race) snapRaceMarks();commit();}
  updateCursor(); render();
}
function ptr(e){const r=stage.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}

/* hover */
function updateHover(sp){
  const tool=effTool();
  state.hover=null;
  if(state.space) return;
  if(tool==='pen'||tool==='line'){state.hover=penAction(sp,tool==='line');}
  else if(tool==='split'){const tg=splitTarget(sp);if(tg) state.hover={act:'split',...tg};}
  else if(tool==='race'){
    const h=raceHandleAt(sp);
    if(h!=null) state.hover={act:'raceHandle',key:h};
    else{const hp=hitPiece(sp);const R=state.race;
      if(hp&&R&&hp.path===R.p&&!state.doc.race.start) state.hover={act:'raceStart',pt:lineProject(R.line,toW(sp)).pt};
      else if(hp) state.hover={act:'piece',p:hp.path,k:hp.k};}
  }
  else if(tool==='direct'||tool==='select'){const hp=hitPiece(sp);if(hp) state.hover={act:'piece',p:hp.path,k:hp.k};}
  else if(tool==='round'){const p=selPath();const c=p&&hitWidget(sp,p);if(c) state.hover={act:'widget',p,j:c.j};else{const hp=hitPiece(sp);if(hp) state.hover={act:'piece',p:hp.path,k:hp.k};}}
  else if(tool==='arc'){const hp=hitPiece(sp);if(hp) state.hover={act:'piece',p:hp.path,k:hp.k};}
  updateCursor();
}
function updateCursor(){
  const t=effTool();
  let c='default';
  if(state.space||(state.drag&&state.drag.type==='pan')) c=state.drag?'grabbing':'grab';
  else if(t==='pen'||t==='line'||t==='measure'||t==='split') c='crosshair';
  else if(t==='arc') c=(state.hover&&state.hover.act==='piece')?'pointer':'crosshair';
  else if(state.hover&&state.hover.act==='raceHandle') c='grab';
  else if(state.hover&&(state.hover.act==='piece'||state.hover.act==='widget'||state.hover.act==='raceStart')) c='pointer';
  stage.style.cursor=c;
}

/* zoom & fit */
function zoomAt(sp,f){
  const w=toW(sp),z=clamp(state.view.z*f,0.02,80);
  state.view.z=z; state.view.tx=sp[0]-w[0]*z; state.view.ty=sp[1]-w[1]*z;
}
function zoomCenter(f){const r=stage.getBoundingClientRect();zoomAt([r.width/2,r.height/2],f);render();}
function fit(){
  const r=stage.getBoundingClientRect();
  if(!r.width||!r.height) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const p of state.doc.paths) for(const n of p.nodes){for(const q of [[n.x,n.y],n.hi,n.ho]) if(q){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1]);}}
  if(!isFinite(x0)){state.view.z=0.6;state.view.tx=r.width/2;state.view.ty=r.height/2;render();return;}
  const pad=state.doc.width+20,w=Math.max(50,x1-x0+pad*2),h=Math.max(50,y1-y0+pad*2);
  const z=clamp(Math.min((r.width-80)/w,(r.height-120)/h),0.02,80);
  state.view.z=z;
  state.view.tx=r.width/2-((x0+x1)/2)*z;
  state.view.ty=(r.height-32)/2-((y0+y1)/2)*z;
  render();
}

/* ---------------- render ---------------- */
let raf=0;
function render(){if(!raf) raf=requestAnimationFrame(()=>{raf=0;draw();});}
function pill(x,y,text,cls){
  const w=text.length*6.7+14;
  return `<g><rect class="${cls||'pill'}" x="${(x-w/2).toFixed(1)}" y="${(y-10).toFixed(1)}" width="${w.toFixed(1)}" height="20"></rect><text class="pill-t" x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle">${esc(text)}</text></g>`;
}
function draw(){
  const {z,tx,ty}=state.view,doc=state.doc,W=doc.width;
  state.bakes=new Map(doc.paths.map(p=>[p.id,bake(p)]));
  state.race=computeRace();
  const R=state.race,rr=doc.race||defaultRace();
  const tool=effTool();
  const g=gridStep(z),a=g.s*z,b=g.major*z;
  const mod=(v,m)=>((v%m)+m)%m;
  let s=`<defs><pattern id="gmin" patternUnits="userSpaceOnUse" width="${a}" height="${a}" x="${mod(tx,a)}" y="${mod(ty,a)}"><path class="g1" d="M${a} 0H0V${a}"></path></pattern>`+
        `<pattern id="gmaj" patternUnits="userSpaceOnUse" width="${b}" height="${b}" x="${mod(tx,b)}" y="${mod(ty,b)}"><path class="g2" d="M${b} 0H0V${b}"></path></pattern></defs>`+
        `<rect width="100%" height="100%" fill="url(#gmin)"></rect><rect width="100%" height="100%" fill="url(#gmaj)"></rect>`;
  s+=`<g transform="matrix(${z} 0 0 ${z} ${tx} ${ty})">`;
  for(const p of doc.paths){
    const bk=state.bakes.get(p.id);
    if(p.nodes.length===1){const n=p.nodes[0];s+=`<circle class="dot" cx="${n.x}" cy="${n.y}" r="${W/2}"></circle>`;continue;}
    s+=`<path class="trk" stroke-width="${W}" d="${piecesD(bk.pieces,p.closed)}"></path>`;
    bk.pieces.forEach((pc,k)=>{if(pc.minR<W/2) s+=`<path class="trk wn" stroke-width="${W}" stroke-linecap="butt" d="${piecesD(bk.pieces,false,k,k+1)}"></path>`;});
  }
  const sp=selPath(),sb=sp&&state.bakes.get(sp.id);
  if(sb&&state.sel.piece!=null&&sb.pieces[state.sel.piece]){
    const d=piecesD(sb.pieces,false,state.sel.piece,state.sel.piece+1);
    s+=`<path class="trk hl" stroke-width="${W}" stroke-linecap="butt" d="${d}"></path><path class="cl" d="${d}"></path>`;
  }
  const hv=state.hover;
  if(!state.drag&&hv&&hv.act==='piece'&&!(hv.p.id===state.sel.path&&hv.k===state.sel.piece)){
    const hb=state.bakes.get(hv.p.id); if(hb&&hb.pieces[hv.k]) s+=`<path class="hov" d="${piecesD(hb.pieces,false,hv.k,hv.k+1)}"></path>`;
  }
  if(!state.drag&&hv&&hv.act==='add'){
    const rs=rawSeg(hv.p,hv.i);
    s+=`<path class="hov" d="M${rs.P[0]}${rs.line?' L'+rs.P[3]:' C'+rs.P[1]+' '+rs.P[2]+' '+rs.P[3]}"></path>`;
  }
  if(tool==='arc'&&sp&&!sp.closed&&sp.nodes.length){
    const ar=state.arc;
    const pl=ar.ghost==='straight'?planStraight(sp,ar.len):planArc(sp,ar.r,ar.ang,ar.dir);
    let d='M'+pl.parts[0].P[0];
    for(const pt of pl.parts) d+=pt.line?' L'+pt.P[3]:' C'+pt.P[1]+' '+pt.P[2]+' '+pt.P[3];
    s+=`<path class="trk" stroke-width="${W}" style="opacity:.16" d="${d}"></path><path class="ghost" vector-effect="non-scaling-stroke" d="${d}"></path>`;
  }
  if(R){
    const ln=R.line;
    if(rr.arrows&&W*z>=5){
      const step=Math.max(W*4,190/z),h=Math.min(W*0.32,11/z);
      for(let sx=step/2;sx<ln.L;sx+=step){
        const at=lineAt(ln,R.rev?ln.L-sx:sx),t=R.rev?V.mul(at.tan,-1):at.tan,nn=[-t[1],t[0]];
        const tip=V.add(at.pt,V.mul(t,h*0.5)),b=V.sub(at.pt,V.mul(t,h*0.5));
        s+=`<path class="arw" d="M${V.add(b,V.mul(nn,h*0.7))} L${tip} L${V.sub(b,V.mul(nn,h*0.7))}"></path>`;
      }
    }
    const across=(sv,cls)=>{const at=lineAt(ln,sv),nn=[-at.tan[1],at.tan[0]],a=V.add(at.pt,V.mul(nn,W/2)),c=V.sub(at.pt,V.mul(nn,W/2));return `<line class="${cls}" x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}"></line>`;};
    if(R.sectors) R.sectors.forEach(sv=>{s+=across(sv,'secl');});
    if(rr.start){
      const at=lineAt(ln,R.s0),t=at.tan,nn=[-t[1],t[0]],k=Math.max(4,Math.round(W/1.5)),q=W/k;
      let d='';
      for(let row=0;row<2;row++) for(let i=0;i<k;i++){
        if((i+row)%2) continue;
        const o=V.add(at.pt,V.add(V.mul(nn,-W/2+i*q),V.mul(t,(row-1)*q)));
        const a1=V.add(o,V.mul(nn,q)),a2=V.add(a1,V.mul(t,q)),a3=V.add(o,V.mul(t,q));
        d+=`M${o} L${a1} L${a2} L${a3} Z `;
      }
      s+=`<path class="chq" d="${d}"></path>`;
    }
  }
  s+='</g>';

  /* overlays in screen space */
  const drawing=tool==='pen'||tool==='line';
  const showAnchors=(drawing||tool==='direct'||tool==='arc'||tool==='split');
  const ap=state.penPath&&getPath(state.penPath);
  const anchorPaths=new Set();
  if(showAnchors&&sp) anchorPaths.add(sp);
  if(ap) anchorPaths.add(ap);
  for(const p of anchorPaths){
    const isSel=p===sp;
    const hidx=new Set(isSel?state.sel.nodes:[]);
    if(ap===p&&p.nodes.length) hidx.add(p.nodes.length-1);
    for(const i of hidx){
      const n=p.nodes[i]; if(!n) continue;
      const as=toS([n.x,n.y]);
      for(const w of ['hi','ho']) if(n[w]){const h=toS(n[w]);s+=`<line class="hl-line" x1="${as[0]}" y1="${as[1]}" x2="${h[0]}" y2="${h[1]}"></line><circle class="hdl" cx="${h[0]}" cy="${h[1]}" r="3.5"></circle>`;}
    }
    p.nodes.forEach((n,i)=>{
      const q=toS([n.x,n.y]),on=isSel&&state.sel.nodes.has(i);
      s+=`<rect class="anc${on?' on':''}" x="${(q[0]-3.5).toFixed(1)}" y="${(q[1]-3.5).toFixed(1)}" width="7" height="7"></rect>`;
    });
  }
  if(drawing&&ap&&ap.nodes.length&&state.cursorS&&!state.drag&&state.hover){
    const l=ap.nodes[ap.nodes.length-1],a0=toS([l.x,l.y]);
    let tw;
    const hvA=state.hover.act;
    if(hvA==='close') tw=[ap.nodes[0].x,ap.nodes[0].y];
    else if(hvA==='join'){const o=state.hover.o.nodes[state.hover.i];tw=[o.x,o.y];}
    else{tw=toW(state.cursorS);if(state.shift) tw=constrain45([l.x,l.y],tw);tw=snapPt(tw);}
    const c=toS(tw),curved=tool==='pen'&&l.ho;
    s+=curved?`<path class="rb" d="M${a0} C${toS(l.ho)} ${c} ${c}"></path>`:`<line class="rb" x1="${a0[0]}" y1="${a0[1]}" x2="${c[0]}" y2="${c[1]}"></line>`;
    if(!curved&&hvA!=='none'){const L=V.dist([l.x,l.y],tw);if(L>0.5) s+=pill(state.cursorS[0]+36,state.cursorS[1]-18,fmtLen(L,1));}
  }
  if(tool==='split'&&hv&&hv.act==='split'&&!state.drag){
    const q=toS(hv.pt),tn=hv.tan||[1,0],nr=[-tn[1],tn[0]],hw=Math.max(10,W*z/2+6);
    s+=`<line class="rul" x1="${q[0]-nr[0]*hw}" y1="${q[1]-nr[1]*hw}" x2="${q[0]+nr[0]*hw}" y2="${q[1]+nr[1]*hw}"></line><circle class="wdg on" cx="${q[0]}" cy="${q[1]}" r="4"></circle>`;
  }
  if(tool==='round'&&sp&&sb){
    for(const k in sb.corners){
      const c=sb.corners[k],q=toS(cornerWidgetPos(sp,c)),on=state.sel.nodes.has(c.j);
      if(on&&c.effR){
        const pc=sb.pieces.find(x=>x.kind==='corner'&&x.j===c.j);
        if(pc){const A=toS(pc.parts[0].P[0]),B=toS(pc.parts[pc.parts.length-1].P[3]),Vv=toS(c.v);s+=`<path class="vtx" d="M${A} L${Vv} L${B}"></path>`;}
      }
      s+=`<circle class="wdg${on?' on':''}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="5"></circle>`;
      const showLbl=on||(hv&&hv.act==='widget'&&hv.j===c.j)||(state.drag&&state.drag.type==='round'&&state.drag.j===c.j);
      if(showLbl){
        const lim=c.r>c.maxR+0.05;
        s+=pill(q[0],q[1]-22,c.effR?('R '+fmtR(c.effR)+' m'+(lim?' max':'')):'Drag to round');
      }
    }
  }
  if(state.drag&&state.drag.type==='marquee'){
    const d=state.drag,x=Math.min(d.sp0[0],d.sp1[0]),y=Math.min(d.sp0[1],d.sp1[1]);
    s+=`<rect class="mq" x="${x}" y="${y}" width="${Math.abs(d.sp1[0]-d.sp0[0])}" height="${Math.abs(d.sp1[1]-d.sp0[1])}"></rect>`;
  }
  if(state.ruler){
    const A=toS(state.ruler.a),B=toS(state.ruler.b),L=V.dist(state.ruler.a,state.ruler.b);
    const dir=V.norm(V.sub(B,A)),nrm=[-dir[1]*7,dir[0]*7];
    s+=`<line class="rul" x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}"></line>`;
    for(const P of [A,B]) s+=`<line class="rul" x1="${P[0]-nrm[0]}" y1="${P[1]-nrm[1]}" x2="${P[0]+nrm[0]}" y2="${P[1]+nrm[1]}"></line>`;
    if(L>0){const m=V.lerp(A,B,0.5);s+=pill(m[0],m[1]-16,fmtLen(L,1));}
  }
  if(sb&&state.sel.piece!=null&&sb.pieces[state.sel.piece]&&!state.drag){
    const pc=sb.pieces[state.sel.piece],pts=samplePiece(pc),mid=toS(pts[Math.floor(pts.length/2)]);
    s+=pill(mid[0],mid[1]-Math.max(18,W*z/2+14),fmtLen(pc.len));
  }
  if((drawing||tool==='split')&&state.cursorS&&!state.drag&&state.hover){
    const gl={close:'○',lastHandle:'^',continue:'/',add:'+',delete:'−',convert:'^',join:'○',split:'✂'}[state.hover.act];
    if(gl) s+=`<text class="glyph" x="${state.cursorS[0]+10}" y="${state.cursorS[1]+20}">${gl}</text>`;
  }
  if(R){
    const ln=R.line,offS=W*z/2+16;
    if(rr.numbers) for(const t of R.turns){
      const q=V.add(toS(t.pt),V.mul(t.out,offS+6));
      s+=`<text class="tlab" x="${q[0].toFixed(1)}" y="${(q[1]+4).toFixed(1)}" text-anchor="middle">${esc(t.name?t.name:'T'+t.n)}</text>`;
    }
    const markLbl=(sv,txt,cls)=>{const at=lineAt(ln,sv),nn=[-at.tan[1],at.tan[0]],q=V.add(toS(at.pt),V.mul(nn,offS+8));s+=pill(q[0],q[1],txt,cls);};
    if(R.sectors){const ord=R.sectors.map((sv,i)=>({sv,d:R.dist(R.s0,sv)})).sort((a,c)=>a.d-c.d);ord.forEach((o,i)=>markLbl(o.sv,'S'+(i+2),'pill sec'));}
    if(rr.start) markLbl(R.s0,'START','pill ink');
    if(tool==='race'){
      const hs=[];if(rr.start) hs.push(R.s0);if(R.sectors) hs.push(...R.sectors);
      for(const sv of hs){const q=toS(lineAt(ln,sv).pt);s+=`<circle class="wdg" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="6"></circle>`;}
      if(!rr.start&&hv&&hv.act==='raceStart'){const q=toS(hv.pt);s+=`<circle class="wdg on" cx="${q[0]}" cy="${q[1]}" r="5"></circle>`;}
    }
  }
  stage.innerHTML=s;

  /* chrome */
  $('emptyMsg').hidden=doc.paths.length>0;
  $('zoomLbl').textContent=Math.round(z*100)+'%';
  const sbL=niceLen(120/z);
  $('sb1').style.width=(sbL*z/2)+'px'; $('sb2').style.width=(sbL*z/2)+'px';
  $('sbLbl').textContent=fmtLen(sbL);
  if(state.cursorS){const w=toW(state.cursorS);$('coords').textContent='x '+w[0].toFixed(1)+' m · y '+(-w[1]).toFixed(1)+' m';}
  $('hint').textContent=hintFor(tool);
  renderPanel();
}
function niceLen(t){const p=Math.pow(10,Math.floor(Math.log10(t)));for(const m of [1,2,5,10]) if(m*p>=t) return m*p;return 10*p;}
function fmtLen(m,dec){if(m>=10000) return (m/1000).toFixed(2)+' km';return (dec?m.toFixed(dec):Math.round(m))+' m';}
function fmtR(r){return r>=100?Math.round(r):(Math.round(r*10)/10);}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hintFor(t){
  if(state.space) return 'Drag to pan';
  return {
    pen:state.penPath?'Click for a corner · drag for a curve · Alt-drag to break a handle · click the first point to close · Enter to finish':'Click to start a path · on a selected track, click a segment to add a point or a point to remove it · hold Ctrl for Direct select',
    line:state.penPath?'Click to add a straight · type a length in the panel for precision · click the first point to close · Enter to finish':'Click to start a run of straights, or click the end of an open path to extend it',
    race:'Drag the start line or sector markers along the track · click another path to make it the race track',
    split:'Click the track or a point to cut it there · a loop opens, an open path splits in two',
    direct:'Drag points, handles or segments · Shift-click adds to the selection · Alt-click converts a point · drag empty space to box-select',
    select:'Click a segment to select it · drag to move the whole track · Delete removes it',
    round:'Select a track, then drag a corner’s dot inwards · Shift snaps to 5 m · Alt-click resets a corner',
    arc:'Adds straights and arcs to the end of the selected open path · click empty space to start one',
    measure:'Drag to measure · snaps to points · Shift locks to 45°'
  }[t]||'';
}

/* ---------------- panel ---------------- */
let ctxKey='';
function renderPanel(){
  const p=focusPath(),b=p&&state.bakes.get(p.id);
  const R=state.race&&p&&state.race.p===p?state.race:null;
  const total=b?b.total:0;
  $('lap').innerHTML=(total/1000).toFixed(3)+'<small> km</small>';
  let straights=0,bends=0;
  if(b) for(const pc of b.pieces){if(pc.kind==='seg'&&pc.line) straights++; else bends++;}
  const nTurns=R?R.turns.length:bends;
  const parts=[];
  if(p){parts.push(straights+' straight'+(straights===1?'':'s'),nTurns+' turn'+(nTurns===1?'':'s'));}
  parts.push(state.doc.width+' m wide');
  if(R&&R.closed) parts.push(R.clockwise?'clockwise':'anticlockwise');
  if(p&&!p.closed&&p.nodes.length>1) parts.push('open');
  $('lapSub').textContent=parts.join(' · ');
  document.querySelectorAll('[data-tab]').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.tab===state.listTab)));
  $('segsRight').textContent=state.listTab==='turns'?'Angle · R':'Length';

  let html='';
  if(state.listTab==='turns'){
    if(R&&R.turns.length){
      for(const t of R.turns){
        html+=`<div class="trow"><span class="ix">T${t.n}</span><input class="tname" data-turn="${t.n}" value="${esc(t.name)}" placeholder="Turn ${t.n}" aria-label="Name for turn ${t.n}"><span class="tmeta">${t.dir[0]} ${Math.round(t.deg)}° · ${isFinite(t.minR)?'R '+fmtR(t.minR):'—'}</span></div>`;
      }
    }else html='<div class="segs-empty">'+(p?'No bends of '+((state.doc.race&&state.doc.race.turnMin)||15)+'° or more yet.':'Turns are numbered here once you draw a track.')+'</div>';
    const sl=$('segList');
    if(sl._h!==html&&!sl.contains(document.activeElement)){sl.innerHTML=html;sl._h=html;}
  }else{
    if(b&&b.pieces.length){
      let longest=-1,ll=0;
      b.pieces.forEach((pc,k)=>{if(pc.kind==='seg'&&pc.line&&pc.len>ll){ll=pc.len;longest=k;}});
      const isSel=p&&p.id===state.sel.path;
      const order=R?R.order:b.pieces.map((_,k)=>k);
      const turnOf={};if(R) R.turns.forEach(t=>t.pieces.forEach(k=>{turnOf[k]=t;}));
      order.forEach((k,ix)=>{
        const pc=b.pieces[k];
        const nm=pc.kind==='corner'?'Corner':(pc.line?'Straight':'Curve');
        let em='';
        if(pc.kind==='corner') em='R '+fmtR(pc.R)+' m';
        else if(!pc.line&&isFinite(pc.minR)) em='min R '+fmtR(pc.minR)+' m';
        const tt=turnOf[k],tl=tt?(tt.name||'T'+tt.n):'';
        const warn=pc.minR<state.doc.width/2;
        const on=isSel&&state.sel.piece===k;
        html+=`<button class="srow${on?' on':''}" data-k="${k}" data-p="${p.id}"><span class="ix">${ix+1}</span><span class="nm">${tl?esc(tl)+' · ':''}${nm}${em?`<em>${em}</em>`:''}${warn?'<span class="tight">too tight</span>':''}${k===longest?'<span class="chip">Longest</span>':''}</span><span class="ln">${Math.round(pc.len)} m</span></button>`;
      });
    }else html='<div class="segs-empty">Segments appear here as you draw, with their lengths in metres.</div>';
    const sl=$('segList'); if(sl._h!==html){sl.innerHTML=html;sl._h=html;}
  }

  /* tool context */
  const t=effTool(),s=selPath();
  const one=s&&state.sel.nodes.size===1?[...state.sel.nodes][0]:null;
  const oneInfo=one!=null&&s.nodes[one]?(s.nodes[one].smooth?'s':'c')+(cornerOf(s,one)?'k':''):'';
  const pcInfo=t==='select'&&s&&state.sel.piece!=null?'p'+state.sel.piece:'';
  const rr=state.doc.race||{},raceKey=t==='race'?[!!rr.start,!!rr.sectors,rr.reversed,rr.arrows,rr.numbers,rr.loop,state.race?state.race.closed:''].join(','):'';
  const key=[raceKey,t,state.sel.path,[...state.sel.nodes].join(','),state.penPath?'d':'',state.ruler?'r':'',s?s.closed:'',s?s.nodes.length:'',state.arc.dir,state.arc.ghost,oneInfo,pcInfo].join('|');
  if(key!==ctxKey){ctxKey=key;$('ctx').innerHTML=ctxHTML(t,s);}
  refreshCtx(t,s);
}
function cornerOf(p,j){const b=p&&state.bakes.get(p.id);return b&&b.corners[j];}
function ctxHTML(t,s){
  if(t==='pen'){

    return `<h3>Pen</h3><ul><li><b>Click</b> places a corner point</li><li><b>Click and drag</b> makes a smooth curve</li><li><b>Alt-drag</b> breaks the handle for a sharp change</li><li><b>Click the first point</b> closes the loop</li><li><b>Shift</b> locks to 45°</li></ul>`;

    if(!ap||!ap.nodes.length) return `<h3>Straight line</h3>${tips}`;

      <div class="field"><label for="lineAng">Heading</label><span class="in"><input class="num" id="lineAng" type="number" step="5" value="${ap.nodes.length>1?headingDeg(ap):0}"> °</span></div>

    const dirBtns=R.closed?`<button data-act="raceCW" aria-pressed="${!!R.clockwise}">Clockwise</button><button data-act="raceCCW" aria-pressed="${!R.clockwise}">Anticlockwise</button>`:`<button data-act="raceFwd" aria-pressed="${!r.reversed}">Forward</button><button data-act="raceRev" aria-pressed="${!!r.reversed}">Reverse</button>`;
    return `<h3>Race layout</h3>
      <div class="field"><span>Direction</span><div class="seg" role="group" aria-label="Direction of travel">${dirBtns}</div></div>

      ${r.start?'<p>Drag the circle on the chequered line to move it along the track.</p>':'<p>Click the track to place the start line, or put it on the longest straight.</p>'}
      <div class="row"><button class="btn" data-act="startStraight">On the longest straight</button></div>
      ${R.closed?`<label class="check"><input type="checkbox" data-act="sectorsOn" ${r.sectors?'checked':''}> Sector lines</label>
      ${r.sectors?'<div class="kv"><span>S1 · S2 · S3</span><span data-live="secLens"></span></div><button class="btn" data-act="sectorThirds">Reset to equal thirds</button>':''}`:''}
      <label class="check"><input type="checkbox" data-act="arrowsOn" ${r.arrows?'checked':''}> Direction arrows</label>
      <label class="check"><input type="checkbox" data-act="numbersOn" ${r.numbers?'checked':''}> Turn numbers</label>
      <div class="field"><label for="turnMin">Number bends from</label><span class="in"><input class="num" id="turnMin" type="number" min="1" max="90" step="1" data-act="turnMin"> °</span></div>`;
  }
  if(t==='split') return `<h3>Split</h3><p>Click anywhere on the track, or on a point, to cut it there. A closed loop opens at the cut; an open path becomes two.</p><p>Then use the Pen or Line tool on a cut end to add a section, and click another end to join it back up.</p>`;
  if(t==='direct'){
    if(s&&state.sel.nodes.size===1){
      const i=[...state.sel.nodes][0],n=s.nodes[i];if(!n) return '';
      const c=cornerOf(s,i);
      return `<h3>Point ${i+1}</h3>
        <div class="field"><label for="ptX">x</label><span class="in"><input class="num" id="ptX" type="number" step="0.5" data-act="ptX"> m</span></div>
        <div class="field"><label for="ptY">y</label><span class="in"><input class="num" id="ptY" type="number" step="0.5" data-act="ptY"> m</span></div>
        <div class="field"><span>Type</span><div class="seg" role="group" aria-label="Point type"><button data-act="corner" aria-pressed="${!n.smooth}">Corner</button><button data-act="smooth" aria-pressed="${!!n.smooth}">Smooth</button></div></div>
        ${c?`<div class="field"><label for="ptR">Corner radius</label><span class="in"><input class="num" id="ptR" type="number" min="0" step="1" data-act="ptR"> m</span></div><div class="note" data-live="ptRnote"></div>`:''}`;
    }
    if(s&&state.sel.nodes.size>1) return `<h3>${state.sel.nodes.size} points selected</h3><p>Drag any of them to move them together, or press Delete to remove them.</p>`;
    return `<h3>Direct select</h3><ul><li><b>Drag</b> a point, handle or segment</li><li><b>Shift-click</b> adds to the selection</li><li><b>Alt-click</b> a point to switch corner and curve</li><li><b>Arrow keys</b> nudge 1 m, with Shift 10 m</li></ul>`;
  }
  if(t==='round'){
    if(!s) return `<h3>Round corners</h3><p>Click a track to show its corners. Then drag a corner’s dot inwards, or type a radius below.</p>`;
    const n=[...state.sel.nodes].filter(j=>cornerOf(s,j)).length;
    return `<h3>Round corners</h3>
      <div class="field"><label for="roundR">Radius</label><span class="in"><input class="num" id="roundR" type="number" min="0" step="1" data-act="roundR"> m</span></div>
      <div class="row"><button class="btn" data-act="roundSel" ${n?'':'disabled'}>Apply to ${n||'selected'} corner${n===1?'':'s'}</button><button class="btn" data-act="roundAll">Every corner</button></div>
      <div class="note" data-live="roundNote"></div>`;
  }
  if(t==='arc'){
    if(!s) return `<h3>Straights &amp; arcs</h3><p>Click empty space to drop a starting point, or select an open path. New pieces continue from its end.</p>`;
    if(s.closed) return `<h3>Straights &amp; arcs</h3><p>This track is a closed loop. Select an open path, or click empty space to start a new one.</p>`;
    const ar=state.arc;
    return `<h3>Add from the end</h3>
      ${s.nodes.length===1?`<div class="field"><label for="arcHead">Heading</label><span class="in"><input class="num" id="arcHead" type="number" step="5" data-act="arcHead"> °</span></div>`:''}
      <div class="field"><label for="arcLen">Straight</label><span class="in"><input class="num" id="arcLen" type="number" min="1" step="10" data-act="arcLen" data-ghost="straight"> m</span></div>
      <button class="btn" data-act="addStraight">Add straight</button>
      <div class="field"><label for="arcR">Arc radius</label><span class="in"><input class="num" id="arcR" type="number" min="1" step="5" data-act="arcR" data-ghost="arc"> m</span></div>
      <div class="field"><label for="arcAng">Angle</label><span class="in"><input class="num" id="arcAng" type="number" min="1" max="359" step="5" data-act="arcAng" data-ghost="arc"> °</span></div>
      <div class="field"><span>Turn</span><div class="seg" role="group" aria-label="Turn direction"><button data-act="dirL" aria-pressed="${ar.dir==='left'}">Left</button><button data-act="dirR" aria-pressed="${ar.dir==='right'}">Right</button></div></div>
      <div class="kv"><span>Arc length</span><span data-live="arcLenOut"></span></div>
      <div class="row"><button class="btn" data-act="addArc">Add arc</button>${s.nodes.length>=3?'<button class="btn" data-act="closePath2">Close loop</button>':''}</div>`;
  }
  if(t==='measure'){
    if(!state.ruler) return `<h3>Measure</h3><p>Drag anywhere on the canvas. The ruler snaps to points, and Shift locks it to 45°.</p>`;
    return `<h3>Ruler</h3><div class="big" data-live="rLen"></div><div class="kv"><span>Δx · Δy</span><span data-live="rD"></span></div><div class="kv"><span>Angle</span><span data-live="rA"></span></div><button class="btn" data-act="clearRuler">Clear</button>`;
  }
  if(t==='select'){
    const b=s&&state.bakes.get(s.id),pc=b&&state.sel.piece!=null&&b.pieces[state.sel.piece];
    if(pc) return `<h3>Selected</h3><div class="kv"><span>${pc.kind==='corner'?'Corner':(pc.line?'Straight':'Curve')}</span><span data-live="selLen"></span></div>${pc.kind==='corner'?`<div class="kv"><span>Radius</span><span>${fmtR(pc.R)} m</span></div>`:''}<p>Drag to move the whole track. Delete removes it.</p>`;
    return `<h3>Select</h3><p>Click a segment to see its length. Drag to move the whole track.</p>`;
  }
  return '';
}
function setVal(id,v){const el=$(id);if(el&&document.activeElement!==el) el.value=v;}
function setLive(name,v){const el=document.querySelector(`[data-live="${name}"]`);if(el) el.textContent=v;}
function refreshCtx(t,s){
  if(t==='direct'&&s&&state.sel.nodes.size===1){
    const i=[...state.sel.nodes][0],n=s.nodes[i];
    if(n){setVal('ptX',+n.x.toFixed(2));setVal('ptY',+(-n.y).toFixed(2));
      const c=cornerOf(s,i);
      if(c){setVal('ptR',+(n.r||0).toFixed(1));setLive('ptRnote',(n.r>c.maxR+0.05)?'Limited to '+fmtR(c.maxR)+' m by the neighbouring segments.':'');}}
  }
  if(t==='round'&&s){
    const first=[...state.sel.nodes].find(j=>cornerOf(s,j));
    if(first!=null) setVal('roundR',+(s.nodes[first].r||0).toFixed(1)); else setVal('roundR',state.roundR);
    const c=first!=null&&cornerOf(s,first);
    setLive('roundNote',c&&c.r>c.maxR+0.05?'Limited to '+fmtR(c.maxR)+' m by the neighbouring segments.':'');
  }
  if(t==='arc'){const ar=state.arc;setVal('arcLen',ar.len);setVal('arcR',ar.r);setVal('arcAng',ar.ang);setVal('arcHead',ar.heading);setLive('arcLenOut',Math.round(ar.r*ar.ang*Math.PI/180)+' m');}
  if(t==='measure'&&state.ruler){
    const A=state.ruler.a,B=state.ruler.b,d=V.sub(B,A);
    setLive('rLen',V.dist(A,B).toFixed(1)+' m');
    setLive('rD',Math.abs(d[0]).toFixed(1)+' · '+Math.abs(d[1]).toFixed(1)+' m');
    setLive('rA',(Math.atan2(-d[1],d[0])*180/Math.PI).toFixed(1)+'°');
  }
  if(t==='select'&&s){const b=state.bakes.get(s.id),pc=b&&state.sel.piece!=null&&b.pieces[state.sel.piece];if(pc) setLive('selLen',pc.len.toFixed(1)+' m');}
  if(t==='pen'&&state.penPath){const ap=getPath(state.penPath);setLive('pts',ap?ap.nodes.length:0);}
  if(t==='race'&&state.race){
    const R=state.race,r=state.doc.race;
    setLive('sfState',r.start?'Placed':'Not placed');
    if(R.sectorLens) setLive('secLens',R.sectorLens.map(x=>(x/1000).toFixed(2)).join(' · ')+' km');
    setVal('turnMin',r.turnMin);
  }
}
$('ctx').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-act]'); if(!btn) return;
  const act=btn.dataset.act,s=selPath();
  if(act==='finish'){state.penPath=null;}
  else if(act==='closePath'){const ap=getPath(state.penPath);if(ap&&ap.nodes.length>=3){ap.closed=true;state.penPath=null;commit();}}
  else if(act==='closePath2'){if(s&&s.nodes.length>=3){s.nodes[s.nodes.length-1].ho=null;s.nodes[0].hi=null;s.closed=true;commit();}}
  else if(act==='corner'||act==='smooth'){
    const i=[...state.sel.nodes][0],n=s&&s.nodes[i];if(!n) return;
    if(act==='corner'){n.smooth=false;}
    else{ if(n.hi&&n.ho){const a=[n.x,n.y],dir=V.norm(V.sub(n.ho,n.hi));n.hi=V.sub(a,V.mul(dir,V.dist(a,n.hi)));n.ho=V.add(a,V.mul(dir,V.dist(a,n.ho)));n.smooth=true;} else convertSmooth(s,i); }
    commit();
  }
  else if(act==='roundSel'||act==='roundAll'){
    if(!s) return; const b=state.bakes.get(s.id),R=Math.max(0,+$('roundR').value||0);state.roundR=R;
    const js=act==='roundAll'?Object.keys(b.corners).map(Number):[...state.sel.nodes].filter(j=>b.corners[j]);
    js.forEach(j=>{s.nodes[j].r=R;});
    if(act==='roundAll') state.sel.nodes=new Set(js);
    commit();
  }
  else if(act==='dirL'||act==='dirR'){state.arc.dir=act==='dirL'?'left':'right';state.arc.ghost='arc';}
  else if(act==='addStraight'){if(s&&!s.closed){applyStraight(s,Math.max(1,state.arc.len));state.sel.nodes=new Set([s.nodes.length-1]);state.arc.ghost='straight';commit();}}
  else if(act==='addArc'){if(s&&!s.closed){applyArc(s,Math.max(1,state.arc.r),clamp(state.arc.ang,1,359),state.arc.dir);state.sel.nodes=new Set([s.nodes.length-1]);commit();}}
  else if(act==='clearRuler'){state.ruler=null;}
  else if(act==='lineAdd'){lineAddTyped();return;}
  else if(act.startsWith('race')||act==='startStraight'||act==='sectorThirds'){
    const R=state.race,r=state.doc.race; if(!R) return;
    if(act==='raceCW') r.reversed=!R.cwGeo;
    else if(act==='raceCCW') r.reversed=R.cwGeo;
    else if(act==='raceFwd') r.reversed=false;
    else if(act==='raceRev') r.reversed=true;
    else if(act==='startStraight'){
      let best=-1,bl=0;R.b.pieces.forEach((pc,k)=>{if(pc.line&&pc.len>bl){bl=pc.len;best=k;}});
      if(best<0){toast('There is no straight to put it on yet.');return;}
      const a=R.line.pk[best],e2=(best+1<R.line.pk.length?R.line.pk[best+1]:R.L);
      r.start=lineAt(R.line,R.rev?e2-0.65*(e2-a):a+0.65*(e2-a)).pt;
    }else if(act==='sectorThirds') placeThirds(R,r);
    commit();
  }
  render();
});
function placeThirds(R,r){
  const f=R.rev?-1:1;
  r.sectors=[lineAt(R.line,R.s0+f*R.L/3).pt,lineAt(R.line,R.s0+f*2*R.L/3).pt];
}
$('ctx').addEventListener('input',e=>{
  const el=e.target,act=el.dataset&&el.dataset.act; if(!act) return;
  if(el.type==='checkbox'){
    const r=state.doc.race,R=state.race; if(!r) return;
    if(act==='sectorsOn'){if(el.checked&&R) placeThirds(R,r); else r.sectors=null;}
    else if(act==='arrowsOn') r.arrows=el.checked;
    else if(act==='numbersOn') r.numbers=el.checked;
    commit(); render(); return;
  }
  if(act==='turnMin'){const v=parseFloat(el.value);if(isFinite(v)&&v>=1&&v<=90&&state.doc.race){state.doc.race.turnMin=v;markDirty();render();}return;}
  const v=parseFloat(el.value); if(!isFinite(v)) return;
  const s=selPath();
  if(el.id==='lineLen'){const v2=parseFloat(el.value);if(isFinite(v2)&&v2>0) state.lineLen=v2;return;}
  if(el.dataset.ghost) state.arc.ghost=el.dataset.ghost;
  if(act==='arcLen') state.arc.len=v;
  else if(act==='arcR') state.arc.r=v;
  else if(act==='arcAng') state.arc.ang=v;
  else if(act==='arcHead') state.arc.heading=v;
  else if(act==='roundR'){state.roundR=Math.max(0,v);if(s){const b=state.bakes.get(s.id);for(const j of state.sel.nodes) if(b.corners[j]) s.nodes[j].r=Math.max(0,v);markDirty();}}
  else if(s){
    const i=[...state.sel.nodes][0],n=s.nodes[i]; if(!n) return;
    if(act==='ptX') moveNode(n,[v-n.x,0]);
    else if(act==='ptY') moveNode(n,[0,-v-n.y]);
    else if(act==='ptR') n.r=Math.max(0,v);
    markDirty();
  }
  render();
});
$('ctx').addEventListener('change',()=>{if(state.dirty) commit();});
$('ctx').addEventListener('focusin',e=>{const g=e.target.dataset&&e.target.dataset.ghost;if(g&&state.arc.ghost!==g){state.arc.ghost=g;render();}});

document.querySelectorAll('[data-tab]').forEach(t=>t.addEventListener('click',()=>{state.listTab=t.dataset.tab;$('segList')._h='';render();}));
$('segList').addEventListener('input',e=>{
  const el=e.target; if(!el.classList.contains('tname')) return;
  const r=state.doc.race; if(!r) return;
  const v=el.value.trim(); if(v) r.names[el.dataset.turn]=v.slice(0,60); else delete r.names[el.dataset.turn];
