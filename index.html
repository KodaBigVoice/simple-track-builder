<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A metre-scaled path editor for designing racing circuits.">
<style>body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Circuit Track Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drawing area left (toolbar, canvas, status), circuit panel right; panel stacks under the canvas on phones. */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --canvas:#F5F5F3; --ink:#121212; --muted:#5C5C5A;
  --line:#E4E4E1; --grid-minor:#ECECE9; --grid-major:#D9D9D5; --hover:#F1F1EE;
  --accent:#D4231A; --on-accent:#FFFFFF; --warn:#B45309; --sector:#1D5FD1; --pit:#55554F; --pitbox:#C9C9C4; --building:#E2E2DD; --grass:#CFE3BF; --gravel:#E5D8B4; --runoff:#B9B9B4; --sand:#EEDFB8; --stand:#A9BBD0; --stand-row:#7F93AD; --concrete:#7A7A74; --armco:#9A9A96; --drs:#15803D; --ref-bld:#DCDCD6; --ref-bld-edge:#C4C4BE; --ref-water:#BFD7E6; --ref-road:#8E8E88; --ref-bridge:#6B6B66; --ref-road-bold:#0891B2;
  --f-sans:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E0F; --panel:#111112; --canvas:#18181A; --ink:#F2F2F0; --muted:#A3A3A0;
    --line:#2A2A2D; --grid-minor:#202023; --grid-major:#2E2E32; --hover:#1F1F22;
    --warn:#FBBF24; --sector:#2F6FE0; --pit:#B5B5AF; --pitbox:#3A3A3E; --building:#26262A; --grass:#22331F; --gravel:#4B4330; --runoff:#3A3A3E; --sand:#544A33; --stand:#34465C; --stand-row:#4C6584; --concrete:#8C8C86; --armco:#C9C9C4; --drs:#22C55E; --ref-bld:#2B2B30; --ref-bld-edge:#3A3A40; --ref-water:#1E3442; --ref-road:#6E6E6A; --ref-bridge:#A3A3A0; --ref-road-bold:#22D3EE; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E0F; --panel:#111112; --canvas:#18181A; --ink:#F2F2F0; --muted:#A3A3A0;
  --line:#2A2A2D; --grid-minor:#202023; --grid-major:#2E2E32; --hover:#1F1F22;
  --warn:#FBBF24; --sector:#2F6FE0; --pit:#B5B5AF; --pitbox:#3A3A3E; --building:#26262A; --grass:#22331F; --gravel:#4B4330; --runoff:#3A3A3E; --sand:#544A33; --stand:#34465C; --stand-row:#4C6584; --concrete:#8C8C86; --armco:#C9C9C4; --drs:#22C55E; --ref-bld:#2B2B30; --ref-bld-edge:#3A3A40; --ref-water:#1E3442; --ref-road:#6E6E6A; --ref-bridge:#A3A3A0; --ref-road-bold:#22D3EE; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:flex;height:100%}
.work{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}

/* toolbar */
.toolbar{height:60px;flex-shrink:0;display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tb{height:44px;min-width:44px;padding:0 12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border-bottom:2px solid transparent;color:var(--ink)}
.tb:hover{background:var(--hover)}
.tb[aria-pressed="true"]{border-bottom-color:var(--accent);font-weight:600}
.tb:disabled{opacity:.32;cursor:default;background:transparent}
.tb .key{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tb svg{flex-shrink:0}
.tb.icon{padding:0}
.sep{width:1px;height:24px;background:var(--line);margin:0 8px;flex-shrink:0}
.grow{flex:1 1 8px}
.zoom{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:52px;text-align:center}
.bordered{border:1px solid var(--line);border-bottom:1px solid var(--line)}
.tb.export{background:var(--ink);color:var(--bg);font-weight:600;margin-left:8px;padding:0 14px;border-bottom:0;height:40px}
.tb.export:hover{opacity:.9;background:var(--ink)}
@media (max-width:1400px){ .tb .lbl{display:none} .tb{padding:0 10px} }
@media (max-width:560px){ .tb.export span{display:none} }

/* stage */
.stage-wrap{flex:1 1 auto;min-height:0;position:relative;background:var(--canvas);overflow:hidden}
#refStage,#refTop{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#refTop .ref-roads-halo{fill:none;stroke:var(--canvas);stroke-width:5px;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.85}
#refTop .ref-roads-bold{fill:none;stroke:var(--ref-road-bold);stroke-width:2px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#refStage .ref-buildings{fill:var(--ref-bld);stroke:var(--ref-bld-edge);stroke-width:1px;vector-effect:non-scaling-stroke}
#refStage .ref-water{fill:var(--ref-water)}
#refStage .ref-bridges{fill:none;stroke:var(--ref-bridge);stroke-width:1.5px;stroke-dasharray:6 3;vector-effect:non-scaling-stroke}
#refStage .ref-roads{fill:none;stroke:var(--ref-road);stroke-width:1px;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;opacity:.8}
#refStage .ref-other{fill:none;stroke:var(--muted);stroke-width:1px;vector-effect:non-scaling-stroke}
.refrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.refrow .src{font-size:12px;color:var(--muted)}
.refnote{font-size:12px;color:var(--muted);margin:0}
#elevSvg{width:100%;height:96px;display:block;background:var(--canvas);border:1px solid var(--line)}
#elevSvg .ef{fill:var(--accent);opacity:.12}
#elevSvg .el{fill:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
#elevSvg .eg{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
#elevSvg .et{font:10px var(--f-mono);fill:var(--muted)}
.chkset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chkset label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
.chkset .in{display:flex;align-items:center;gap:4px;color:var(--muted)}
.chkset .num{width:100%;min-width:0}
.ckrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 2px;font-size:13px}
.ckrow:hover{background:var(--hover)}
.ckrow .ix{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:56px}
.ckrow .ck{width:8px;height:8px;border-radius:50%;background:var(--warn);flex-shrink:0}
.ckok{font-size:13px;color:var(--muted);margin:0}
.chkhl{fill:none;stroke:var(--warn);stroke-linecap:round;stroke-linejoin:round;opacity:.55}
#refTop{z-index:2}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.scalebar{position:absolute;left:20px;bottom:44px;display:flex;align-items:flex-end;gap:10px;font-family:var(--f-mono);font-size:11px;color:var(--ink);pointer-events:none}
.scalebar .bar{display:flex;height:6px}
.scalebar .bar i{display:block;height:6px;box-sizing:border-box;border:1px solid var(--ink)}
.scalebar .bar i:first-child{background:var(--ink)}
.scalebar .bar i:last-child{background:var(--canvas)}
.status{position:absolute;left:0;right:0;bottom:0;height:32px;display:flex;align-items:center;gap:16px;padding:0 16px;font-size:12px;color:var(--muted);
  background:color-mix(in srgb,var(--canvas) 88%,transparent);border-top:1px solid var(--line)}
.status .hint{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.snap{border:1px solid var(--line);background:var(--bg);height:22px;padding:0 8px;font-size:11px;color:var(--muted)}
.snap[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.empty{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;max-width:360px;line-height:1.5}
.empty strong{display:block;color:var(--ink);font-size:18px;font-weight:600;margin-bottom:6px}

/* svg classes */
.g1{fill:none;stroke:var(--grid-minor);stroke-width:1}
.g2{fill:none;stroke:var(--grid-major);stroke-width:1}
.trk{fill:none;stroke:var(--ink);stroke-linejoin:round;stroke-linecap:round}
.trk.hl{stroke:var(--accent)}
.trkf{fill:var(--ink);stroke:none}
.wkl{stroke:var(--accent);stroke-width:2}
.wkl.on{stroke-width:3}
.wkh{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.wkh.on{fill:var(--accent)}
.wkc{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.wghost{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.wrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px}
.wrow.on{background:var(--hover);font-weight:600}
.wrow .ix{min-width:58px;white-space:nowrap;color:var(--muted);font-family:var(--f-mono);font-size:12px}
.wrow .wv{margin-left:auto;font-family:var(--f-mono);font-size:12px}
.wlist{max-height:240px;overflow:auto}
.trk.wn{stroke:var(--warn)}
.dot{fill:var(--ink)}
.cl{fill:none;stroke:#FFFFFF;stroke-width:1;vector-effect:non-scaling-stroke}
.hov{fill:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.anc{fill:var(--canvas);stroke:var(--accent);stroke-width:1.2}
.anc.on{fill:var(--accent)}
.hl-line{stroke:var(--accent);stroke-width:1;fill:none}
.hdl{fill:var(--canvas);stroke:var(--accent);stroke-width:1.2}
.rb{fill:none;stroke:var(--accent);stroke-width:1}
.mq{fill:var(--accent);fill-opacity:.07;stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3}
.wdg{fill:var(--canvas);stroke:var(--accent);stroke-width:1.6}
.wdg.on{fill:var(--accent)}
.ghost{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 4}
.vtx{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
.pill{fill:var(--accent)}
.pill-t{fill:var(--on-accent);font-family:var(--f-mono);font-size:11px}
.glyph{fill:var(--accent);font-family:var(--f-mono);font-size:13px;font-weight:500}
.rul{stroke:var(--accent);stroke-width:1.4;fill:none}
.arw{fill:none;stroke:var(--canvas);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.85}
.chq{fill:var(--canvas)}
.trk.pitl{stroke:var(--pit)}
.sf{stroke:none}
.sf-grass{fill:var(--grass)}.sf-gravel{fill:var(--gravel)}.sf-tarmac{fill:var(--runoff)}.sf-sand{fill:var(--sand)}
.stand{stroke:var(--stand-row);stroke-width:1;vector-effect:non-scaling-stroke}
.st-fill{fill:var(--stand)}.st-row{fill:var(--stand-row)}
.kerb{fill:none;stroke:#D4231A;stroke-linecap:butt;stroke-linejoin:round}
.kerb-w{fill:none;stroke:#FFFFFF;stroke-dasharray:1.2 1.2;stroke-linecap:butt;stroke-linejoin:round}
.wall{fill:none;stroke-linecap:round;stroke-linejoin:round}
.w-concrete{stroke:var(--concrete)}.w-armco{stroke:var(--armco)}.w-tyres{stroke:#D4231A;stroke-dasharray:2 2}.w-fence{stroke:var(--muted);stroke-dasharray:1 2}
.drsb{fill:none;stroke:var(--drs);stroke-opacity:.42;stroke-linecap:butt;stroke-linejoin:round}
.drsd{stroke:var(--drs);stroke-width:2;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.pill.drs{fill:var(--drs)}
.wdg.drsh{stroke:var(--drs)}
.pbox{fill:var(--pitbox);stroke:var(--canvas);stroke-width:1;vector-effect:non-scaling-stroke}
.garage{fill:var(--building)}
.gridl{fill:none;stroke:var(--canvas);stroke-width:1.4;vector-effect:non-scaling-stroke}
.carm{fill:var(--accent)}
.secl{stroke:var(--sector);stroke-width:2.5;vector-effect:non-scaling-stroke}
.pill.sec{fill:var(--sector)}
.pill.ink{fill:var(--ink)}
.pill.ink+text{fill:var(--bg)}
.nlab{font-family:var(--f-mono);font-size:10px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--canvas);stroke-width:3px}
.tlab{font-family:var(--f-sans);font-size:12px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--canvas);stroke-width:4px;stroke-linejoin:round}

/* panel */
.panel{width:320px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;position:relative;
  padding-block:24px 20px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));box-sizing:border-box;gap:22px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px}
.brand .sq{width:14px;height:14px;background:var(--accent);flex-shrink:0}
.brand b{font-weight:800;letter-spacing:.02em}
.libbtn{margin-left:auto;height:32px;padding:0 10px;border:1px solid var(--line);background:transparent;display:flex;align-items:center;gap:6px;font-size:13px}
.libbtn:hover{background:var(--hover)}
.summary{display:flex;flex-direction:column;gap:4px}
.name{border:0;border-bottom:1px solid transparent;background:transparent;padding:2px 0;font-size:13px;color:var(--muted);width:100%}
.name:hover{border-bottom-color:var(--line)}
.name:focus{outline:none;border-bottom-color:var(--accent);color:var(--ink)}
.lap{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.lap small{font-size:22px;font-weight:600;letter-spacing:0}
.sub{font-size:13px;color:var(--muted)}
.ctx{display:flex;flex-direction:column;gap:10px}
.ctx h3,.sect h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ctx p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.ctx ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);line-height:1.4}
.ctx ul b{color:var(--ink);font-weight:600}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field .in{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.num{width:72px;height:32px;border:1px solid var(--line);background:var(--bg);padding:0 8px;text-align:right;font-family:var(--f-mono);font-size:13px;box-sizing:border-box}
.num:focus{outline:none;border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{height:36px;padding:0 14px;border:1px solid var(--ink);background:transparent;font-weight:500;font-size:13px}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.35;cursor:default;background:transparent}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{opacity:.9}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
.big{font-family:var(--f-mono);font-size:30px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--warn)}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.kv span:last-child{color:var(--ink);font-family:var(--f-mono)}

.sect{display:flex;flex-direction:column;gap:10px}
.segs{display:flex;flex-direction:column;min-height:120px}
.segs-head{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:6px;border-bottom:2px solid var(--ink);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.seglist{display:flex;flex-direction:column}
.tabs{display:flex;gap:14px}
.tabs button{border:0;background:transparent;padding:0 0 4px;font:inherit;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-8px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tg{display:flex;gap:3px}
.trow{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:5px 0}
.trow .ix{font-family:var(--f-mono);font-size:12px;font-weight:500}
.tname{border:0;border-bottom:1px solid transparent;background:transparent;height:28px;padding:0;font-size:14px;min-width:0;width:100%}
.tname::placeholder{color:var(--muted)}
.tname:hover{border-bottom-color:var(--line)}
.tname:focus{outline:none;border-bottom-color:var(--accent)}
.tmeta{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.seg.quad{display:grid;grid-template-columns:1fr 1fr}
.seg.quad button{font-size:12px;padding:0 6px}
.seg.quad button:nth-child(-n+2){border-bottom:1px solid var(--line)}
.sel{height:32px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:0 6px;max-width:170px}
.zrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.zrow .ix{font-family:var(--f-mono);font-weight:500;color:var(--drs)}
.zrow .mono{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.tgl{border:1px solid var(--line);background:transparent;height:24px;min-width:24px;padding:0 5px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.tgl[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.pick{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.srow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 0;font-size:14px}
.srow:hover{background:var(--hover)}
.srow .ix{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.srow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .nm em{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}
.srow .ln{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.srow.on{background:var(--accent);color:var(--on-accent);border-bottom-color:var(--accent);padding-left:8px;padding-right:8px;margin:0 -8px;width:calc(100% + 16px)}
.srow.on .ix,.srow.on .nm em{color:var(--on-accent)}
.srow .tight{color:var(--warn);font-size:12px;margin-left:6px}
.srow.on .tight{color:var(--on-accent)}
.chip{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;padding:0 4px;margin-left:6px;vertical-align:1px}
.segs-empty{padding:12px 0;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}

/* library popover */
.lib{position:absolute;top:64px;left:16px;right:16px;z-index:5;background:var(--panel);border:1px solid var(--ink);box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;flex-direction:column;max-height:70vh}
.lib-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.lib-head h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lib-list{overflow-y:auto}
.lrow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.lrow .open{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.lrow .open:hover{background:var(--hover)}
.lrow .open b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .open span{font-size:12px;color:var(--muted)}
.lrow.cur .open b::before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);margin-right:8px;vertical-align:1px}
.lrow .del{border:0;background:transparent;height:44px;padding:0 14px;font-size:12px;color:var(--muted)}
.lrow .del:hover{color:var(--accent)}

.lib-foot{padding:10px 14px;font-size:12px;color:var(--muted)}

.lib-files .btn{flex:1}

.panel>*{flex-shrink:0}

.toast{position:fixed;left:50%;bottom:calc(48px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font-size:13px;z-index:20;max-width:min(520px,calc(100vw - 32px))}

@media (max-width:820px){

}

<script>
(function(){
'use strict';

/* ---------------- vectors ---------------- */
const V={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1]],
  mul:(a,k)=>[a[0]*k,a[1]*k],
  len:a=>Math.hypot(a[0],a[1]),
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1],
  cross:(a,b)=>a[0]*b[1]-a[1]*b[0],
  norm:a=>{const l=Math.hypot(a[0],a[1]);return l>1e-12?[a[0]/l,a[1]/l]:[0,0];},
  lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],
  dist:(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1])

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------------- segment maths (s = {line, P:[p0,p1,p2,p3]}) ---------------- */
function sPoint(s,t){
  if(s.line) return V.lerp(s.P[0],s.P[3],t);
  const a=s.P[0],b=s.P[1],c=s.P[2],d=s.P[3],u=1-t;

}
function sDeriv(s,t){
  if(s.line) return V.sub(s.P[3],s.P[0]);
  const a=s.P[0],b=s.P[1],c=s.P[2],d=s.P[3],u=1-t;
  return [3*u*u*(b[0]-a[0])+6*u*t*(c[0]-b[0])+3*t*t*(d[0]-c[0]), 3*u*u*(b[1]-a[1])+6*u*t*(c[1]-b[1])+3*t*t*(d[1]-c[1])];
}
function sDeriv2(s,t){
  if(s.line) return [0,0];
  const a=s.P[0],b=s.P[1],c=s.P[2],d=s.P[3];
  return [6*(1-t)*(c[0]-2*b[0]+a[0])+6*t*(d[0]-2*c[0]+b[0]), 6*(1-t)*(c[1]-2*b[1]+a[1])+6*t*(d[1]-2*c[1]+b[1])];
}
function sTan(s,t){
  const d=sDeriv(s,t);
  if(V.len(d)>1e-9) return V.norm(d);
  const e=1e-3;
  const dd=t<0.5?V.sub(sPoint(s,Math.min(1,t+e)),sPoint(s,t)):V.sub(sPoint(s,t),sPoint(s,Math.max(0,t-e)));
  if(V.len(dd)>1e-12) return V.norm(dd);
  return V.norm(V.sub(s.P[3],s.P[0]));
}
function sLut(s){
  if(s._lut) return s._lut;
  const n=s.line?1:48, L=[0];
  let prev=s.P[0],acc=0;
  for(let i=1;i<=n;i++){const p=sPoint(s,i/n);acc+=V.dist(prev,p);L.push(acc);prev=p;}
  s._lut={n,L,total:acc};
  return s._lut;
}
function sLen(s){return sLut(s).total;}
function sParamAt(s,d){
  const {n,L,total}=sLut(s);
  if(d<=0) return 0;
  if(d>=total) return 1;
  let i=1; while(i<n && L[i]<d) i++;
  const a=L[i-1],b=L[i];
  return ((i-1)+(b>a?(d-a)/(b-a):0))/n;
}
function splitC(P,t){
  const [a,b,c,d]=P;
  const ab=V.lerp(a,b,t),bc=V.lerp(b,c,t),cd=V.lerp(c,d,t),abc=V.lerp(ab,bc,t),bcd=V.lerp(bc,cd,t),m=V.lerp(abc,bcd,t);
  return [[a,ab,abc,m],[m,bcd,cd,d]];
}
function subSeg(s,t0,t1){
  if(s.line){const a=sPoint(s,t0),b=sPoint(s,t1);return {line:true,P:[a,a,b,b]};}
  let P=s.P;
  if(t1<1) P=splitC(P,t1)[0];
  if(t0>0) P=splitC(P,t0/t1)[1];
  return {line:false,P};
}
function minRadius(s){
  if(s.line) return Infinity;
  let kmax=0;
  for(let i=0;i<=40;i++){
    const t=i/40,d=sDeriv(s,t),dd=sDeriv2(s,t),v=V.len(d);
    if(v<1e-6) continue;
    const k=Math.abs(V.cross(d,dd))/(v*v*v);
    if(k>kmax) kmax=k;
  }
  return kmax>1e-9?1/kmax:Infinity;
}
/* circular arc as cubic parts (y points down, positive sweep = clockwise on screen) */
function arcParts(c,R,a0,sweep){
  const parts=[], n=Math.max(1,Math.ceil(Math.abs(sweep)/(Math.PI/2)-1e-9)), step=sweep/n;
  const k=4/3*Math.tan(step/4)*R;
  for(let i=0;i<n;i++){
    const a=a0+step*i,b=a+step;
    const pa=[c[0]+R*Math.cos(a),c[1]+R*Math.sin(a)], pb=[c[0]+R*Math.cos(b),c[1]+R*Math.sin(b)];
    const ta=[-Math.sin(a),Math.cos(a)], tb=[-Math.sin(b),Math.cos(b)];
    parts.push({line:false,P:[pa,V.add(pa,V.mul(ta,k)),V.sub(pb,V.mul(tb,k)),pb]});
  }
  return parts;
}

/* ---------------- path model ----------------
   path  {id, closed, nodes:[node]}
   node  {x, y, hi:[x,y]|null, ho:[x,y]|null, smooth:bool, r:metres}
   units are metres, y increases downward (screen convention). */
function segCount(p){const n=p.nodes.length;return n<2?0:(p.closed?n:n-1);}
function rawSeg(p,i){
  const n=p.nodes.length,a=p.nodes[i],b=p.nodes[(i+1)%n];
  const p0=[a.x,a.y],p3=[b.x,b.y];
  return {line:!a.ho&&!b.hi,P:[p0,a.ho?a.ho.slice():p0,b.hi?b.hi.slice():p3,p3]};
}
function bake(p){
  const n=p.nodes.length,sc=segCount(p),segs=[],corners={};
  for(let i=0;i<sc;i++){const s=rawSeg(p,i);segs.push({s,t0:0,t1:1,len:sLen(s)});}
  for(let j=0;j<n;j++){
    const inI=j>0?j-1:(p.closed?n-1:-1);
    const outI=j<sc?j:-1;
    if(inI<0||outI<0||inI>=sc) continue;
    if(p.closed&&n===2&&inI===outI) continue;
    const A=segs[inI],B=segs[outI];
    if(A.len<1e-6||B.len<1e-6) continue;
    const dIn=sTan(A.s,1),dOut=sTan(B.s,0);
    const delta=Math.acos(clamp(V.dot(dIn,dOut),-1,1));
    if(delta<0.02) continue;
    const nd=p.nodes[j];
    const tanH=Math.tan(delta/2);
    const ok=delta<Math.PI-0.02;
    const info={j,delta,tanH,ok,v:[nd.x,nd.y],bis:V.norm(V.sub(dOut,dIn)),maxR:0,r:nd.r||0,effR:0,t:0,req:ok&&nd.r>0?nd.r*tanH:0,inI,outI};
    corners[j]=info;
  }
  /* share each segment between the corners at its two ends: in proportion only when they ask for more than it has */
  const startC=i=>{const c=corners[i];return c&&c.outI===i?c:null;};
  const endC=i=>{const c=corners[(i+1)%n];return c&&c.inI===i?c:null;};
  const fac=segs.map((sg,i)=>{const a=startC(i),b=endC(i),s=(a?a.req:0)+(b?b.req:0);return s>sg.len&&s>0?sg.len/s:1;});
  for(const k in corners){
    const c=corners[k];
    const t=c.req*Math.min(fac[c.inI],fac[c.outI]);
    if(t>1e-6){c.t=t;c.effR=t/c.tanH;}
  }
  for(const k in corners){
    const c=corners[k]; if(!c.ok) continue;
    const o1=startC(c.inI),o2=endC(c.outI);
    const avIn=segs[c.inI].len-(o1&&o1!==c?o1.t:0),avOut=segs[c.outI].len-(o2&&o2!==c?o2.t:0);
    c.maxR=Math.max(0,Math.min(avIn,avOut))/c.tanH;
  }
  for(const k in corners){
    const c=corners[k]; if(!c.effR) continue;
    const A=segs[c.inI],B=segs[c.outI];
    A.t1=sParamAt(A.s,A.len-c.t);
    B.t0=sParamAt(B.s,c.t);
  }
  const pieces=[];
  for(let i=0;i<sc;i++){
    const sg=segs[i];
    if(sg.t1-sg.t0>1e-7){
      const ss=subSeg(sg.s,sg.t0,sg.t1);
      pieces.push({kind:'seg',i,line:ss.line,parts:[ss],len:sLen(ss),minR:ss.line?Infinity:minRadius(ss)});
    }
    const j=(i+1)%n,c=corners[j];
    if(c&&c.effR&&c.inI===i){
      const A=segs[c.inI],B=segs[c.outI];
      const pa=sPoint(A.s,A.t1),pb=sPoint(B.s,B.t0);
      const da=sTan(A.s,A.t1),db=sTan(B.s,B.t0);
      let parts;
      if(A.s.line&&B.s.line){
        const turn=Math.sign(V.cross(da,db))||1;
        const nrm=turn>0?[-da[1],da[0]]:[da[1],-da[0]];
        const ctr=V.add(pa,V.mul(nrm,c.effR));
        const a0=Math.atan2(pa[1]-ctr[1],pa[0]-ctr[0]);
        parts=arcParts(ctr,c.effR,a0,turn*c.delta);
        parts[parts.length-1].P[3]=pb;
      }else{
        const d2=Math.acos(clamp(V.dot(da,db),-1,1)),chord=V.dist(pa,pb);
        const Rr=d2>1e-6?chord/(2*Math.sin(d2/2)):0,k=4/3*Math.tan(d2/4)*Rr;
        parts=[{line:false,P:[pa,V.add(pa,V.mul(da,k)),V.sub(pb,V.mul(db,k)),pb]}];
      }
      let L=0; for(const pt of parts) L+=sLen(pt);
      pieces.push({kind:'corner',j,line:false,parts,len:L,R:c.effR,minR:c.effR});
    }
  }
  let total=0; for(const pc of pieces) total+=pc.len;
  return {pieces,corners,total};
}
function piecesD(pieces,closed,from,to){

function commit(){

  hist.stack.push(snap);

function restore(){
  state.doc=JSON.parse(hist.stack[hist.i]);
  if(state.wsel!=null&&!(state.doc.race&&state.doc.race.widths&&state.doc.race.widths[state.wsel])) state.wsel=null;
  const p=selPath();
  if(!p) state.sel={path:null,nodes:new Set(),piece:null};
  else state.sel.nodes=new Set([...state.sel.nodes].filter(i=>i<p.nodes.length));
  state.sel.piece=null;
  if(state.penPath){const pp=getPath(state.penPath);if(!pp||pp.closed) state.penPath=null;}
  syncDocInputs(); updateUndo(); scheduleSave(); render();
}
function undo(){if(state.drag) return; if(hist.i>0){hist.i--;restore();}}
function redo(){if(state.drag) return; if(hist.i<hist.stack.length-1){hist.i++;restore();}}
function updateUndo(){$('undoBtn').disabled=hist.i<=0;$('redoBtn').disabled=hist.i>=hist.stack.length-1;}
const markDirty=()=>{state.dirty=true;};

/* ---------------- geometry edits ---------------- */
function reversePath(p){p.nodes.reverse();for(const n of p.nodes){const t=n.hi;n.hi=n.ho;n.ho=t;}}
function insertNode(p,i,t){
  const s=rawSeg(p,i),n=p.nodes.length,a=p.nodes[i],b=p.nodes[(i+1)%n];
  let node;
  if(s.line){const q=sPoint(s,t);node={x:q[0],y:q[1],hi:null,ho:null,smooth:false,r:0};}
  else{
    const [L,R]=splitC(s.P,t);
    a.ho=L[1];b.hi=R[2];
    node={x:L[3][0],y:L[3][1],hi:L[2],ho:R[1],smooth:true,r:0};
  }
  p.nodes.splice(i+1,0,node);
  return i+1;
}
function deleteNodes(p,idxs){
  [...idxs].sort((a,b)=>b-a).forEach(i=>p.nodes.splice(i,1));
  if(p.nodes.length<3&&p.closed) p.closed=p.nodes.length>=3;
  if(p.nodes.length===0) state.doc.paths=state.doc.paths.filter(q=>q!==p);
  state.sel.nodes=new Set(); state.sel.piece=null;
  if(!getPath(p.id)) state.sel.path=null;
}
function splitAtNode(p,k){
  const n=p.nodes.length,cp=o=>JSON.parse(JSON.stringify(o));
  if(p.closed){
    const order=[];for(let q=0;q<n;q++) order.push(p.nodes[(k+q)%n]);
    const first=cp(order[0]),end=cp(order[0]);
    first.hi=null;first.r=0;end.ho=null;end.r=0;
    p.nodes=[first,...order.slice(1),end];p.closed=false;
    return {p,ends:[0,p.nodes.length-1]};
  }
  if(k<=0||k>=n-1) return null;
  const a=p.nodes.slice(0,k+1).map(cp),b=p.nodes.slice(k).map(cp);
  a[a.length-1].ho=null;a[a.length-1].r=0;b[0].hi=null;b[0].r=0;
  p.nodes=a;
  const np={id:uid(),closed:false,nodes:b};
  state.doc.paths.splice(state.doc.paths.indexOf(p)+1,0,np);
  return {p,np,ends:[a.length-1]};
}
function splitTarget(sp){
  const paths=state.doc.paths.slice().reverse();
  for(const p of paths){
    const h=hitAnchor(sp,p);
    if(h>=0){if(!p.closed&&(h===0||h===p.nodes.length-1)) continue;return {p,node:h,pt:[p.nodes[h].x,p.nodes[h].y]};}
  }
  const tol=Math.max(8,state.doc.width*state.view.z/2);
  for(const p of paths){const hs=hitRawSeg(sp,p,tol);if(hs) return {p,i:hs.i,t:hs.t,pt:sPoint(rawSeg(p,hs.i),hs.t),tan:sTan(rawSeg(p,hs.i),hs.t)};}
  return null;
}
function joinPaths(ap,o,atStart,lineMode){
  if(!atStart) reversePath(o);
  const last=ap.nodes[ap.nodes.length-1];
  if(lineMode){last.ho=null;o.nodes[0].hi=null;}
  ap.nodes.push(...o.nodes);
  state.doc.paths=state.doc.paths.filter(q=>q!==o);
}
function moveNode(n,d){n.x+=d[0];n.y+=d[1];if(n.hi)n.hi=V.add(n.hi,d);if(n.ho)n.ho=V.add(n.ho,d);}
function constrain45(a,m){
  const d=V.sub(m,a),L=V.len(d);if(L<1e-9) return m;

function gridStep(z){
  const target=14/z,p=Math.pow(10,Math.floor(Math.log10(target)));
  let s=10*p; for(const m of [1,2,5]){if(m*p>=target){s=m*p;break;}}
  const base=Math.round(s/Math.pow(10,Math.floor(Math.log10(s)+1e-9)));
  return {s,major:base===5?s*2:s*5};
}
function snapPt(w){
  if(!state.snap) return w;
  const s=gridStep(state.view.z).s;
  return [Math.round(w[0]/s)*s,Math.round(w[1]/s)*s];
}
function convertSmooth(p,i){
  const n=p.nodes.length,nd=p.nodes[i];
  const prev=p.nodes[i>0?i-1:(p.closed?n-1:i)],next=p.nodes[i<n-1?i+1:(p.closed?0:i)];
  const a=[nd.x,nd.y];
  let dir=V.norm(V.sub([next.x,next.y],[prev.x,prev.y]));
  if(!V.len(dir)) dir=[1,0];
  const li=prev===nd?40:V.dist(a,[prev.x,prev.y])/3,lo=next===nd?40:V.dist(a,[next.x,next.y])/3;
  nd.hi=V.sub(a,V.mul(dir,li)); nd.ho=V.add(a,V.mul(dir,lo)); nd.smooth=true;
}
function endHeading(p){
  const n=p.nodes.length,last=p.nodes[n-1];
  if(last.ho&&V.dist(last.ho,[last.x,last.y])>1e-6) return V.norm(V.sub(last.ho,[last.x,last.y]));
  if(n>=2) return sTan(rawSeg(p,n-2),1);
  const h=state.arc.heading*Math.PI/180;
  return [Math.cos(h),-Math.sin(h)];
}
function planStraight(p,L){
  const last=p.nodes[p.nodes.length-1],a=[last.x,last.y],d=endHeading(p),b=V.add(a,V.mul(d,L));
  return {parts:[{line:true,P:[a,a,b,b]}],end:b};
}
function planArc(p,R,deg,dir){
  const last=p.nodes[p.nodes.length-1],a=[last.x,last.y],d=endHeading(p);
  const sg=dir==='right'?1:-1;
  const nrm=sg>0?[-d[1],d[0]]:[d[1],-d[0]];
  const c=V.add(a,V.mul(nrm,R));
  const a0=Math.atan2(a[1]-c[1],a[0]-c[0]);
  return {parts:arcParts(c,R,a0,sg*deg*Math.PI/180)};
}
function applyStraight(p,L){
  const pl=planStraight(p,L),last=p.nodes[p.nodes.length-1];
  last.ho=null;
  p.nodes.push({x:pl.end[0],y:pl.end[1],hi:null,ho:null,smooth:false,r:0});
}
function applyArc(p,R,deg,dir){
  const pl=planArc(p,R,deg,dir);
  let prev=p.nodes[p.nodes.length-1];
  for(const pt of pl.parts){
    prev.ho=pt.P[1];
    if(prev.hi) prev.smooth=true;
    const nd={x:pt.P[3][0],y:pt.P[3][1],hi:pt.P[2],ho:null,smooth:true,r:0};
    p.nodes.push(nd); prev=nd;

/* ---------------- hit testing (screen px) ---------------- */
function distToPoly(sp,pts){
  let best=Infinity;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],ab=V.sub(b,a),L2=V.dot(ab,ab);
    let t=L2?V.dot(V.sub(sp,a),ab)/L2:0; t=clamp(t,0,1);
    const d=V.dist(sp,V.lerp(a,b,t)); if(d<best) best=d;
  }
  return best;
}
function hitAnchor(sp,p){
  if(!p) return -1;
  let best=-1,bd=8;
  p.nodes.forEach((n,i)=>{const d=V.dist(sp,toS([n.x,n.y]));if(d<=bd){bd=d;best=i;}});
  return best;
}
function hitHandle(sp,p,idxs){
  if(!p) return null;
  for(const i of idxs){
    const n=p.nodes[i]; if(!n) continue;
    for(const w of ['hi','ho']) if(n[w]&&V.dist(sp,toS(n[w]))<=7) return {i,which:w};
  }
  return null;
}
function hitPiece(sp,onlyPath){
  const tol=Math.max(7,state.doc.width*state.view.z/2);
  const PT=state.race&&state.race.pit;
  const scan=(paths,tl)=>{
    let best=null,bd=tl;
    for(const p of paths){
      const b=state.bakes.get(p.id); if(!b) continue;
      b.pieces.forEach((pc,k)=>{const d=distToPoly(sp,samplePiece(pc).map(toS));if(d<bd){bd=d;best={path:p,k};}});
    }
    return best;
  };
  if(onlyPath) return scan([onlyPath],onlyPath.role?8:tol);
  const all=state.doc.paths.slice().reverse();
  const road=scan(all.filter(p=>!p.role&&!(PT&&p===PT.p)),tol)||(PT?scan([PT.p],Math.max(7,PT.width*state.view.z/2)):null);
  if(road) return road;
  const edge=scan(all.filter(p=>p.role),8);
  if(edge) return edge;
  const w=toW(sp);
  for(const p of all) if((p.role==='surface'||p.role==='stand')&&p.closed&&inPoly(w,pathPoly(p))) return {path:p,k:0};
  return null;
}
function hitRawSeg(sp,p,tol){
  if(!p) return null;
  let best=null,bd=tol||8;
  for(let i=0;i<segCount(p);i++){
    const s=rawSeg(p,i),N=s.line?24:64;
    let bt=0,bdd=Infinity;
    for(let k=0;k<=N;k++){const d=V.dist(sp,toS(sPoint(s,k/N)));if(d<bdd){bdd=d;bt=k/N;}}
    let lo=Math.max(0,bt-1/N),hi=Math.min(1,bt+1/N);
    for(let it=0;it<20;it++){
      const m1=lo+(hi-lo)/3,m2=hi-(hi-lo)/3;
      if(V.dist(sp,toS(sPoint(s,m1)))<V.dist(sp,toS(sPoint(s,m2)))) hi=m2; else lo=m1;
    }
    const t=(lo+hi)/2,d=V.dist(sp,toS(sPoint(s,t)));
    if(d<bd&&t>0.01&&t<0.99){bd=d;best={i,t};}
  }
  return best;
}
function cornerWidgetPos(p,c){
  const b=state.bakes.get(p.id);
  if(c.effR&&b){
    const pc=b.pieces.find(q=>q.kind==='corner'&&q.j===c.j);
    if(pc){const pts=samplePiece(pc);return pts[Math.floor(pts.length/2)];}
  }
  return V.add(c.v,V.mul(c.bis,18/state.view.z));
}
function hitWidget(sp,p){
  const b=p&&state.bakes.get(p.id); if(!b) return null;
  for(const k in b.corners){const c=b.corners[k];if(V.dist(sp,toS(cornerWidgetPos(p,c)))<=9) return c;}
  return null;
}
function snapToAnchor(sp){
  for(const p of state.doc.paths) for(const n of p.nodes){
    if(V.dist(sp,toS([n.x,n.y]))<=8) return [n.x,n.y];
  }
  return null;
}

/* ---------------- tools ---------------- */
function effTool(e){
  const mod=e?(e.ctrlKey||e.metaKey):state.mod;
  if((state.tool==='pen'||state.tool==='line')&&mod) return 'direct';
  return state.tool;
}
function penAction(sp,lineMode){
  let ap=state.penPath&&getPath(state.penPath);
  if(ap&&ap.closed) ap=null;
  if(ap){
    const h=hitAnchor(sp,ap);
    if(h===0&&ap.nodes.length>=2) return {act:'close',p:ap};
    if(h===ap.nodes.length-1&&h>=0) return {act:lineMode?'none':'lastHandle',p:ap,i:h};
    for(const o of state.doc.paths){
      if(o===ap||o.closed||!o.nodes.length) continue;
      const k=hitAnchor(sp,o);
      if(k===0||k===o.nodes.length-1) return {act:'join',p:ap,o,i:k};
    }
    return {act:'new',p:ap};
  }
  for(const p of state.doc.paths){
    if(p.closed||!p.nodes.length) continue;
    const h=hitAnchor(sp,p);
    if(h===0||h===p.nodes.length-1) return {act:'continue',p,i:h};
  }
  const sp_=selPath();
  if(sp_&&!lineMode){
    const h=hitAnchor(sp_,sp_);
    if(h>=0) return {act:state.alt?'convert':'delete',p:sp_,i:h};
    const hs=hitRawSeg(sp,sp_);
    if(hs) return {act:'add',p:sp_,i:hs.i,t:hs.t};
  }
  return {act:'new',p:null};
}
function hitAnchorWrap(sp,p){return hitAnchor(sp,p);}

function onDown(e){
  if(e.button===2) return;
  try{stage.setPointerCapture(e.pointerId);}catch(_){}
  const sp=ptr(e),wp=toW(sp);
  state.alt=e.altKey; state.shift=e.shiftKey;
  closeLib();
  if(e.button===1||state.space){state.drag={type:'pan',sp0:sp,t0:[state.view.tx,state.view.ty]};updateCursor();return;}
  const tool=effTool(e);
  if(tool==='pen') penDown(sp,wp,e,false);
  else if(tool==='line') penDown(sp,wp,e,true);
  else if(tool==='split') splitDown(sp);
  else if(tool==='race') raceDown(sp,wp,e);
  else if(tool==='direct') directDown(sp,wp,e);
  else if(tool==='select') selectDown(sp,wp,e);
  else if(tool==='round') roundDown(sp,wp,e);
  else if(tool==='arc') arcDown(sp,wp,e);
  else if(tool==='measure') measureDown(sp,wp,e);
  else if(tool==='width') widthDown(sp,wp,e);
  render();
}
function penDown(sp,wp,e,lineMode){
  state.alt=e.altKey;
  const a=penAction(sp,lineMode);
  if(a.act==='none'){state.drag={type:'none'};return;}
  if(a.act==='close'){
    a.p.closed=true; const n0=a.p.nodes[0]; n0.hi=null;
    state.sel={path:a.p.id,nodes:new Set([0]),piece:null};
    state.penPath=null; markDirty();
    if(lineMode){a.p.nodes[a.p.nodes.length-1].ho=null;state.drag={type:'none'};return;}
    state.drag={type:'penHandle',p:a.p,i:0,mode:'close',sp0:sp,moved:false};
    return;
  }
  if(a.act==='join'){
    joinPaths(a.p,a.o,a.i===0,lineMode);
    state.penPath=null; state.sel={path:a.p.id,nodes:new Set(),piece:null};
    markDirty(); state.drag={type:'none'}; return;
  }
  if(a.act==='lastHandle'){
    const nd=a.p.nodes[a.i]; nd.ho=null; nd.smooth=false;
    state.drag={type:'penHandle',p:a.p,i:a.i,mode:'outOnly',sp0:sp,moved:false}; markDirty(); return;
  }
  if(a.act==='continue'){
    if(a.i===0&&a.p.nodes.length>1) reversePath(a.p);
    state.penPath=a.p.id; state.sel={path:a.p.id,nodes:new Set([a.p.nodes.length-1]),piece:null}; return;
  }

  if(a.act==='delete'){deleteNodes(a.p,[a.i]);state.sel.path=getPath(a.p.id)?a.p.id:null;markDirty();commit();return;}
  if(a.act==='add'){const k=insertNode(a.p,a.i,a.t);state.sel={path:a.p.id,nodes:new Set([k]),piece:null};markDirty();commit();return;}
  let ap=a.p, p=snapPt(wp);
  if(ap&&e.shiftKey){const l=ap.nodes[ap.nodes.length-1];p=constrain45([l.x,l.y],p);}
  if(!ap){ap={id:uid(),closed:false,nodes:[]};state.doc.paths.push(ap);state.penPath=ap.id;}
  if(lineMode&&ap.nodes.length) ap.nodes[ap.nodes.length-1].ho=null;
  ap.nodes.push({x:p[0],y:p[1],hi:null,ho:null,smooth:false,r:0});
  state.sel={path:ap.id,nodes:new Set([ap.nodes.length-1]),piece:null};
  state.drag=lineMode?{type:'none'}:{type:'penHandle',p:ap,i:ap.nodes.length-1,mode:'new',sp0:sp,moved:false,lastW:wp};
  markDirty();
}
function splitDown(sp){
  state.drag={type:'none'};
  const tg=splitTarget(sp); if(!tg) return;
  const k=tg.node!=null?tg.node:insertNode(tg.p,tg.i,tg.t);
  const res=splitAtNode(tg.p,k);
  if(!res){if(tg.node==null) markDirty();return;}
  state.sel={path:res.p.id,nodes:new Set(res.ends),piece:null};
  markDirty();
  toast(res.np?'Split into two paths.':'Loop opened. Use the Pen or Line tool on an end to extend it.');
}
function raceHandleAt(sp){
  const R=state.race,r=state.doc.race; if(!R) return null;
  if(r.start&&V.dist(sp,toS(lineAt(R.line,R.s0).pt))<=10) return 'start';
  if(R.sectors) for(let i=0;i<R.sectors.length;i++) if(V.dist(sp,toS(lineAt(R.line,R.sectors[i]).pt))<=10) return i;
  if(R.pit&&R.pit.boxes.length&&state.raceTab==='pits'&&V.dist(sp,toS(lineAt(R.pit.line,R.pit.cs).pt))<=10) return 'pitc';
  if(state.raceTab==='kerbs') for(const z of R.drs) for(const [k,d] of [['a',z.dAct],['e',z.dEnd],['d',z.dDet]]) if(V.dist(sp,toS(lineAt(R.line,R.sOf(d)).pt))<=10) return 'drs:'+z.i+':'+k;

function raceDown(sp,wp){
  state.drag={type:'none'};
  const R=state.race,r=state.doc.race;
  const h=raceHandleAt(sp);
  if(h!=null){state.drag={type:'raceMark',key:h,sp0:sp,moved:false};return;}
  const hp=hitPiece(sp);
  if(!hp) return;
  if(R&&hp.path===R.p){
    if(!r.start){r.start=lineProject(R.line,wp).pt;markDirty();}
    return;
  }
  state.sel={path:hp.path.id,nodes:new Set(),piece:null};
}
function makeRaceTrack(p){
  const r=state.doc.race;
  r.loop=p.id;r.start=null;r.sectors=null;r.reversed=false;
  if(r.pit.path===p.id){r.pit.path=null;r.pit.centre=null;}
  commit();
}
function makePitLane(p){
  const r=state.doc.race,R=state.race; if(!R||p===R.p) return;
  r.pit.path=p.id;r.pit.centre=null;r.pit.flipSide=false;
  const W=state.doc.width;let snapped=0;
  if(!p.closed) [0,p.nodes.length-1].forEach(i=>{
    const nd=p.nodes[i],pr=lineProject(R.line,[nd.x,nd.y]);
    if(pr.dist>W*3+40) return;
    const at=lineAt(R.line,pr.s),nn=[-at.tan[1],at.tan[0]],side=Math.sign(V.dot(V.sub([nd.x,nd.y],at.pt),nn))||1;
    const h=R.hw(pr.s);moveNode(nd,V.sub(V.add(at.pt,V.mul(nn,side*(side>0?h.b:h.a))),[nd.x,nd.y]));snapped++;
  });
  commit();
  toast(snapped===2?'Pit lane set. Both ends now meet the track edge.':'Pit lane set. Draw its ends close to the track so they join up.');
}
function lineAddTyped(){
  const ap=state.penPath&&getPath(state.penPath)||(selPath()&&!selPath().closed?selPath():null);
  if(!ap||!ap.nodes.length) return;
  const L=parseFloat($('lineLen')&&$('lineLen').value),A=parseFloat($('lineAng')&&$('lineAng').value);
  if(!isFinite(L)||L<=0) return;
  const h=(isFinite(A)?A:0)*Math.PI/180,last=ap.nodes[ap.nodes.length-1];
  last.ho=null;
  ap.nodes.push({x:last.x+Math.cos(h)*L,y:last.y-Math.sin(h)*L,hi:null,ho:null,smooth:false,r:0});
  state.penPath=ap.id; state.sel={path:ap.id,nodes:new Set([ap.nodes.length-1]),piece:null};
  commit(); ctxKey=''; render();
}
function headingDeg(p){const d=endHeading(p);return Math.round(Math.atan2(-d[1],d[0])*1800/Math.PI)/10;}
function convertStart(p,i,sp){
  const nd=p.nodes[i]; nd.hi=null; nd.ho=null; nd.smooth=false;
  state.sel={path:p.id,nodes:new Set([i]),piece:null};
  state.drag={type:'penHandle',p,i,mode:'pull',sp0:sp,moved:false};
  markDirty();
}
function directDown(sp,wp,e){
  const sel=selPath();
  if(sel){
    const h=hitHandle(sp,sel,state.sel.nodes);
    if(h){const nd=sel.nodes[h.i];if(e.altKey) nd.smooth=false;state.drag={type:'handle',p:sel,i:h.i,which:h.which,sp0:sp,moved:false};return;}
  }
  const order=sel?[sel,...state.doc.paths.filter(p=>p!==sel)]:state.doc.paths.slice().reverse();
  for(const p of order){
    const h=hitAnchor(sp,p);
    if(h<0) continue;
    if(state.sel.path!==p.id) state.sel={path:p.id,nodes:new Set(),piece:null};
    state.sel.piece=null;
    if(e.altKey){
      const nd=p.nodes[h];
      if(nd.hi||nd.ho){nd.hi=null;nd.ho=null;nd.smooth=false;state.sel.nodes=new Set([h]);markDirty();state.drag={type:'none'};return;}
      convertStart(p,h,sp);return;
    }
    if(e.shiftKey){
      if(state.sel.nodes.has(h)){state.sel.nodes.delete(h);state.drag={type:'none'};return;}
      state.sel.nodes.add(h);
    }else if(!state.sel.nodes.has(h)) state.sel.nodes=new Set([h]);
    beginMoveNodes(p,wp,sp); return;
  }
  const hp=hitPiece(sp);
  if(hp){
    const b=state.bakes.get(hp.path.id),pc=b.pieces[hp.k],n=hp.path.nodes.length;
    state.sel={path:hp.path.id,nodes:new Set(pc.kind==='seg'?[pc.i,(pc.i+1)%n]:[pc.j]),piece:hp.k};
    beginMoveNodes(hp.path,wp,sp); return;
  }
  if(!e.shiftKey){state.sel.nodes=new Set();state.sel.piece=null;}
  state.drag={type:'marquee',sp0:sp,sp1:sp,additive:e.shiftKey};
}
function beginMoveNodes(p,wp,sp){
  const orig={};
  for(const i of state.sel.nodes) orig[i]=JSON.parse(JSON.stringify(p.nodes[i]));
  state.drag={type:'moveNodes',p,w0:wp,sp0:sp,orig,moved:false};
}
function selectDown(sp,wp,e){
  const hp=hitPiece(sp);
  if(hp){
    state.sel={path:hp.path.id,nodes:new Set(),piece:hp.k};
    const rr0=state.doc.race,isRace=state.race&&state.race.p===hp.path;
    state.drag={type:'movePath',p:hp.path,w0:wp,sp0:sp,orig:JSON.parse(JSON.stringify(hp.path.nodes)),moved:false,race:isRace&&rr0?{start:rr0.start,sectors:rr0.sectors,widths:(rr0.widths||[]).map(k=>k.pt)}:null};
  }else{state.sel={path:null,nodes:new Set(),piece:null};state.drag={type:'none'};}
}
function roundDown(sp,wp,e){
  const p=selPath();
  const c=p&&hitWidget(sp,p);
  if(c){
    if(e.altKey){p.nodes[c.j].r=0;markDirty();commit();state.drag={type:'none'};return;}
    if(e.shiftKey){if(state.sel.nodes.has(c.j)) state.sel.nodes.delete(c.j); else state.sel.nodes.add(c.j);}
    else if(!state.sel.nodes.has(c.j)) state.sel.nodes=new Set([c.j]);
    state.sel.piece=null;
    state.drag={type:'round',p,j:c.j,sp0:sp,moved:false};
    return;
  }
  const hp=hitPiece(sp);
  if(hp){state.sel={path:hp.path.id,nodes:new Set(),piece:hp.k};state.drag={type:'none'};return;}
  state.sel.nodes=new Set();state.sel.piece=null;state.drag={type:'none'};
}
function arcDown(sp,wp,e){
  const hp=hitPiece(sp);
  if(hp){state.sel={path:hp.path.id,nodes:new Set(),piece:hp.k};state.drag={type:'none'};return;}
  const p=selPath();
  if(p&&!p.closed){state.drag={type:'none'};return;}
  const w=snapPt(wp);
  const np={id:uid(),closed:false,nodes:[{x:w[0],y:w[1],hi:null,ho:null,smooth:false,r:0}]};
  state.doc.paths.push(np);
  state.sel={path:np.id,nodes:new Set([0]),piece:null};
  markDirty();commit();state.drag={type:'none'};
}
/* width tool: keyframes along the race track */
function wkfGeom(R,k){
  const sv=lineProject(R.line,k.pt).s,at=lineAt(R.line,sv),t=R.travelTan(sv),left=[t[1],-t[0]],h=R.hwT(sv);
  return {sv,c:at.pt,left,L:V.add(at.pt,V.mul(left,h.l)),Rt:V.sub(at.pt,V.mul(left,h.r)),h};
}
function widthHit(sp){
  const R=state.race,r=state.doc.race; if(!R) return null;
  let best=null,bd=9;
  (r.widths||[]).forEach((k,i)=>{
    const g=wkfGeom(R,k);
    for(const [pt,act,side] of [[g.L,'wedge','l'],[g.Rt,'wedge','r'],[g.c,'wkf',null]]){const d=V.dist(sp,toS(pt));if(d<bd){bd=d;best={act,i,side};}}
  });
  if(best) return best;
  const w=toW(sp),pr=lineProject(R.line,w),h=R.hw(pr.s);
  if(pr.dist<=Math.max(h.a,h.b)+6/state.view.z) return {act:'wadd',s:pr.s,pt:pr.pt};
  return null;
}
function widthDown(sp,wp,e){
  state.drag={type:'none'};
  const R=state.race,r=state.doc.race; if(!R){toast('Make a closed loop the race track first, then set its width here.');return;}
  const h=widthHit(sp);
  if(!h){state.wsel=null;return;}
  if(h.act==='wadd'){
    const t=R.hwT(h.s);
    r.widths.push({pt:h.pt,l:+t.l.toFixed(2),r:+t.r.toFixed(2),ease:'smooth',link:Math.abs(t.l-t.r)<0.05});
    state.wsel=r.widths.length-1;markDirty();commit();
    state.drag={type:'wkfMove',i:state.wsel,sp0:sp,moved:false};return;
  }
  state.wsel=h.i;
  state.drag=h.act==='wedge'?{type:'wkfEdge',i:h.i,side:h.side,sp0:sp,moved:false}:{type:'wkfMove',i:h.i,sp0:sp,moved:false};
}
function widthDrag(d,wp,e){
  const R=state.race,r=state.doc.race,k=r&&r.widths[d.i]; if(!R||!k) return;
  if(d.type==='wkfMove'){k.pt=lineProject(R.line,wp).pt;markDirty();return;}
  const g=wkfGeom(R,k);let v=V.dot(V.sub(wp,g.c),g.left);if(d.side==='r') v=-v;
  v=Math.max(0.5,v); v=e.shiftKey?Math.round(v*2)/2:Math.round(v*10)/10;
  if(k.link&&!e.altKey){k.l=v;k.r=v;} else k[d.side]=v;
  markDirty();
}
function widthRange(R){
  if(!R.varW) return [state.doc.width,state.doc.width];
  let lo=Infinity,hi=0;for(let sv=0;sv<R.L;sv+=4){const h=R.hw(sv),w=h.a+h.b;lo=Math.min(lo,w);hi=Math.max(hi,w);}
  return [lo,hi];
}
function measureDown(sp,wp){
  const a=snapToAnchor(sp)||snapPt(wp);
  state.ruler={a,b:a};
  state.drag={type:'ruler'};
}

function onMove(e){
  const sp=ptr(e);
  state.cursorS=sp; state.alt=e.altKey; state.shift=e.shiftKey; state.mod=e.ctrlKey||e.metaKey;
  const d=state.drag;
  if(!d){updateHover(sp);render();return;}
  const wp=toW(sp);
  if(d.type==='pan'){state.view.tx=d.t0[0]+sp[0]-d.sp0[0];state.view.ty=d.t0[1]+sp[1]-d.sp0[1];render();return;}
  if(!d.moved&&d.sp0&&V.dist(sp,d.sp0)<3) {render();return;}
  d.moved=true;
  if(d.type==='penHandle'){
    const nd=d.p.nodes[d.i],a=[nd.x,nd.y];
    if(state.space&&d.mode==='new'){const dd=V.sub(wp,d.lastW||wp);moveNode(nd,dd);d.lastW=wp;render();return;}
    d.lastW=wp;
    let m=wp; if(e.shiftKey) m=constrain45(a,m);
    const mir=V.sub(V.mul(a,2),m);
    if(d.mode==='outOnly'){nd.ho=m;}
    else if(d.mode==='close'){nd.hi=mir;if(!e.altKey){nd.ho=m.slice();nd.smooth=true;}else nd.smooth=false;}
    else if(d.mode==='new'||d.mode==='pull'){
      if(e.altKey){nd.ho=m;nd.smooth=false;if(!nd.hi&&d.mode==='pull') nd.hi=null;}
      else{nd.ho=m;nd.hi=mir;nd.smooth=true;}
    }
    markDirty();
  }else if(d.type==='handle'){
    const nd=d.p.nodes[d.i],a=[nd.x,nd.y];
    let m=wp; if(e.shiftKey) m=constrain45(a,m);
    nd[d.which]=m;
    const other=d.which==='hi'?'ho':'hi';
    if(e.altKey) nd.smooth=false;
    else if(nd.smooth&&nd[other]){
      const L=V.dist(nd[other],a),dir=V.norm(V.sub(a,m));
      if(V.len(dir)) nd[other]=V.add(a,V.mul(dir,L));
    }
    markDirty();
  }else if(d.type==='moveNodes'||d.type==='movePath'){
    let dd=V.sub(wp,d.w0);
    if(e.shiftKey) dd=constrain45([0,0],dd);
    if(state.snap){
      const first=d.type==='movePath'?d.orig[0]:d.orig[Object.keys(d.orig)[0]];
      if(first){const t=snapPt([first.x+dd[0],first.y+dd[1]]);dd=[t[0]-first.x,t[1]-first.y];}
    }
    if(d.type==='movePath'){
      d.p.nodes=d.orig.map(n=>{const c=JSON.parse(JSON.stringify(n));moveNode(c,dd);return c;});
      if(d.race){const r=state.doc.race;if(d.race.start) r.start=V.add(d.race.start,dd);if(d.race.sectors) r.sectors=d.race.sectors.map(q=>V.add(q,dd));if(d.race.widths&&r.widths) r.widths.forEach((k,i)=>{if(d.race.widths[i]) k.pt=V.add(d.race.widths[i],dd);});}
    }else{
      for(const k in d.orig){const c=JSON.parse(JSON.stringify(d.orig[k]));moveNode(c,dd);d.p.nodes[k]=c;}
    }
    markDirty();
  }else if(d.type==='marquee'){d.sp1=sp;}
  else if(d.type==='raceMark'){
    const R=state.race,r=state.doc.race;
    if(R){
      if(d.key==='pitc'){if(R.pit) r.pit.centre=lineProject(R.pit.line,wp).pt;}
      else if(typeof d.key==='string'&&d.key.startsWith('drs:')){const [,i,k]=d.key.split(':');if(r.drs[+i]) r.drs[+i][k]=lineProject(R.line,wp).pt;}
      else{const q=lineProject(R.line,wp).pt;if(d.key==='start') r.start=q; else if(r.sectors) r.sectors[d.key]=q;}
      markDirty();
    }
  }
  else if(d.type==='wkfMove'||d.type==='wkfEdge'){widthDrag(d,wp,e);}
  else if(d.type==='round'){
    const b=state.bakes.get(d.p.id),c=b&&b.corners[d.j];
    if(c){
      const s=V.dot(V.sub(wp,c.v),c.bis),ch=Math.cos(c.delta/2);
      let R=s>0?s*ch/Math.max(1e-6,1-ch):0;
      R=clamp(R,0,c.maxR);
      if(e.shiftKey) R=Math.round(R/5)*5;
      R=Math.round(R*10)/10;
      for(const j of state.sel.nodes){if(b.corners[j]) d.p.nodes[j].r=Math.min(R,b.corners[j].maxR||R);}
      d.p.nodes[d.j].r=R; d.liveR=R;
      markDirty();
    }
  }else if(d.type==='ruler'){
    let b=snapToAnchor(sp)||snapPt(wp);
    if(e.shiftKey) b=constrain45(state.ruler.a,b);
    state.ruler.b=b;
  }
  render();
}
function onUp(e){
  const d=state.drag; state.drag=null;
  if(d&&d.type==='marquee'&&V.dist(d.sp0,d.sp1)>3){
    const x0=Math.min(d.sp0[0],d.sp1[0]),x1=Math.max(d.sp0[0],d.sp1[0]),y0=Math.min(d.sp0[1],d.sp1[1]),y1=Math.max(d.sp0[1],d.sp1[1]);
    const inside=n=>{const s=toS([n.x,n.y]);return s[0]>=x0&&s[0]<=x1&&s[1]>=y0&&s[1]<=y1;};
    let target=selPath(),hits=[];
    if(target) target.nodes.forEach((n,i)=>{if(inside(n)) hits.push(i);});
    if(!hits.length){
      for(const p of state.doc.paths){const h=[];p.nodes.forEach((n,i)=>{if(inside(n)) h.push(i);});if(h.length){target=p;hits=h;break;}}
    }
    if(hits.length){
      if(state.sel.path!==target.id||!d.additive) state.sel={path:target.id,nodes:new Set(),piece:null};
      hits.forEach(i=>state.sel.nodes.add(i));
    }
  }
  if(state.dirty){if(state.race) snapRaceMarks();commit();}
  updateCursor(); render();
}
function ptr(e){const r=stage.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}

/* hover */
function updateHover(sp){
  const tool=effTool();
  state.hover=null;
  if(state.space) return;
  if(tool==='pen'||tool==='line'){state.hover=penAction(sp,tool==='line');}
  else if(tool==='split'){const tg=splitTarget(sp);if(tg) state.hover={act:'split',...tg};}
  else if(tool==='race'){
    const h=raceHandleAt(sp);
    if(h!=null) state.hover={act:'raceHandle',key:h};
    else{const hp=hitPiece(sp);const R=state.race;
      if(hp&&R&&hp.path===R.p&&!state.doc.race.start) state.hover={act:'raceStart',pt:lineProject(R.line,toW(sp)).pt};
      else if(hp) state.hover={act:'piece',p:hp.path,k:hp.k};}
  }
  else if(tool==='direct'||tool==='select'){const hp=hitPiece(sp);if(hp) state.hover={act:'piece',p:hp.path,k:hp.k};}
  else if(tool==='round'){const p=selPath();const c=p&&hitWidget(sp,p);if(c) state.hover={act:'widget',p,j:c.j};else{const hp=hitPiece(sp);if(hp) state.hover={act:'piece',p:hp.path,k:hp.k};}}
  else if(tool==='arc'){const hp=hitPiece(sp);if(hp) state.hover={act:'piece',p:hp.path,k:hp.k};}
  else if(tool==='width'){state.hover=widthHit(sp);}
  updateCursor();
}
function updateCursor(){
  const t=effTool();
  let c='default';
  if(state.space||(state.drag&&state.drag.type==='pan')) c=state.drag?'grabbing':'grab';
  else if(t==='pen'||t==='line'||t==='measure'||t==='split') c='crosshair';
  else if(t==='arc') c=(state.hover&&state.hover.act==='piece')?'pointer':'crosshair';
  else if(t==='width') c=state.hover?(state.hover.act==='wadd'?'copy':state.hover.act==='wedge'?'ew-resize':'grab'):'default';
  else if(state.hover&&state.hover.act==='raceHandle') c='grab';
  else if(state.hover&&(state.hover.act==='piece'||state.hover.act==='widget'||state.hover.act==='raceStart')) c='pointer';
  stage.style.cursor=c;
}

/* zoom & fit */
function zoomAt(sp,f){
  const w=toW(sp),z=clamp(state.view.z*f,0.02,80);
  state.view.z=z; state.view.tx=sp[0]-w[0]*z; state.view.ty=sp[1]-w[1]*z;
}
function zoomCenter(f){const r=stage.getBoundingClientRect();zoomAt([r.width/2,r.height/2],f);render();}
function fit(){
  const r=stage.getBoundingClientRect();
  if(!r.width||!r.height) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const p of state.doc.paths) for(const n of p.nodes){for(const q of [[n.x,n.y],n.hi,n.ho]) if(q){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1]);}}
  if(!isFinite(x0)){state.view.z=0.6;state.view.tx=r.width/2;state.view.ty=r.height/2;render();return;}
  const pad=state.doc.width+20,w=Math.max(50,x1-x0+pad*2),h=Math.max(50,y1-y0+pad*2);
  const z=clamp(Math.min((r.width-80)/w,(r.height-120)/h),0.02,80);
  state.view.z=z;
  state.view.tx=r.width/2-((x0+x1)/2)*z;
  state.view.ty=(r.height-32)/2-((y0+y1)/2)*z;
  render();
}

/* ---------------- render ---------------- */
let raf=0;
function render(){if(!raf) raf=requestAnimationFrame(()=>{raf=0;draw();});}
function bandPts(R,d0,d1,geo,off){
  const n=Math.max(2,Math.ceil((d1-d0)/2)),pts=[];
  for(let i=0;i<=n;i++){const u=i/n,sv=R.sOf(d0+(d1-d0)*u),at=lineAt(R.line,sv),o=R.outward(geo,at.tan),h=R.hw(sv),H={out:geo>0?h.a:h.b,in:geo>0?h.b:h.a};pts.push(V.add(at.pt,V.mul(o,off(u,H))));}
  return pts;
}
/* filled outline of the race track at its varying width */
function trackOutline(R,step){
  const ln=R.line,L=ln.L,n=Math.max(8,Math.ceil(L/(step||2))),A=[],B=[];
  for(let i=0;i<=n;i++){
    if(R.closed&&i===n) break;
    const sv=L*i/n,at=lineAt(ln,sv),nA=[at.tan[1],-at.tan[0]],h=R.hw(sv);
    A.push(V.add(at.pt,V.mul(nA,h.a)));B.push(V.sub(at.pt,V.mul(nA,h.b)));
  }
  return {A,B,d:R.closed?polyD(A,true)+' '+polyD(B,true):polyD(A.concat(B.slice().reverse()),true)};
}
const polyD=(pts,close)=>pts.length?'M'+pts.map(q=>(+q[0].toFixed(2))+','+(+q[1].toFixed(2))).join(' L')+(close?' Z':''):'';
const smooth01=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const taper=u=>smooth01(u/0.18)*smooth01((1-u)/0.3);
function runoffShapes(R,ro,W){
  const kw=0,out=[];
  for(const z of R.runoffs){
    const inner=bandPts(R,z.d0,z.d1,z.geo,(u,H)=>H.out);
    const full=bandPts(R,z.d0,z.d1,z.geo,(u,H)=>H.out+ro.depth*taper(u));
    const tar=ro.type==='gravel'?null:bandPts(R,z.d0,z.d1,z.geo,(u,H)=>H.out+(ro.type==='tarmac'?ro.depth:Math.min(ro.tarmac,ro.depth))*taper(u));
    const gravel=ro.type==='tarmac'?null:full.concat(inner.slice().reverse());
    const tarmac=tar?tar.concat(inner.slice().reverse()):null;
    const n=full.length,edge=full.slice(Math.floor(n*0.08),Math.ceil(n*0.92));
    out.push({turn:z.turn,gravel,tarmac,edge});
  }
  return out;
}
function pathPoly(p){const b=state.bakes.get(p.id);if(!b) return [];const pts=[];for(const pc of b.pieces) for(const q of samplePiece(pc)) pts.push(q);return pts;}
function inPoly(pt,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0]) c=!c;}return c;}
function standRows(p,R){
  const poly=pathPoly(p); if(poly.length<3) return 0;
  let best=0,bd=Infinity;
  for(let i=1;i<poly.length;i++){const m=V.lerp(poly[i-1],poly[i],0.5),d=R?lineProject(R.line,m).dist:0;if(d<bd){bd=d;best=i;}}
  const e=V.sub(poly[best],poly[best-1]);return Math.atan2(e[1],e[0])*180/Math.PI;
}
function rectD(c,t,n,ha,hc){
  const a=V.add(V.add(c,V.mul(t,ha)),V.mul(n,hc)),b=V.add(V.sub(c,V.mul(t,ha)),V.mul(n,hc)),d=V.sub(V.sub(c,V.mul(t,ha)),V.mul(n,hc)),e=V.sub(V.add(c,V.mul(t,ha)),V.mul(n,hc));
  const f=q=>(+q[0].toFixed(2))+','+(+q[1].toFixed(2));
  return `M${f(a)} L${f(b)} L${f(d)} L${f(e)} Z `;
}
function pill(x,y,text,cls){
  const w=text.length*6.7+14;
  return `<g><rect class="${cls||'pill'}" x="${(x-w/2).toFixed(1)}" y="${(y-10).toFixed(1)}" width="${w.toFixed(1)}" height="20"></rect><text class="pill-t" x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle">${esc(text)}</text></g>`;
}
function draw(){
  const {z,tx,ty}=state.view,doc=state.doc,W=doc.width;
  state.bakes=new Map(doc.paths.map(p=>[p.id,bake(p)]));
  state.race=computeRace();
  const R=state.race,rr=doc.race||defaultRace();
  const tool=effTool();
  const g=gridStep(z),a=g.s*z,b=g.major*z;
  const mod=(v,m)=>((v%m)+m)%m;
  let s=`<defs><pattern id="gmin" patternUnits="userSpaceOnUse" width="${a}" height="${a}" x="${mod(tx,a)}" y="${mod(ty,a)}"><path class="g1" d="M${a} 0H0V${a}"></path></pattern>`+
        `<pattern id="gmaj" patternUnits="userSpaceOnUse" width="${b}" height="${b}" x="${mod(tx,b)}" y="${mod(ty,b)}"><path class="g2" d="M${b} 0H0V${b}"></path></pattern></defs>`+
        `<rect width="100%" height="100%" fill="url(#gmin)"></rect><rect width="100%" height="100%" fill="url(#gmaj)"></rect>`;
  s+=`<g transform="matrix(${z} 0 0 ${z} ${tx} ${ty})">`;
  /* ground layers: surfaces, run-off, grandstands */
  for(const p of doc.paths) if(p.role==='surface'&&p.closed){const bk=state.bakes.get(p.id);s+=`<path class="sf sf-${p.kind||'grass'}" d="${piecesD(bk.pieces,true)}"></path>`;}
  const ROs=R?runoffShapes(R,rr.runoff,W):[];
  for(const o of ROs){if(o.gravel) s+=`<path class="sf sf-gravel" d="${polyD(o.gravel,true)}"></path>`;if(o.tarmac) s+=`<path class="sf sf-tarmac" d="${polyD(o.tarmac,true)}"></path>`;}
  doc.paths.forEach((p,i)=>{
    if(p.role!=='stand'||!p.closed) return;
    const bk=state.bakes.get(p.id),ang=standRows(p,R);
    s+=`<defs><pattern id="rows${i}" patternUnits="userSpaceOnUse" width="1.6" height="1.6" patternTransform="rotate(${ang.toFixed(1)})"><rect width="1.6" height="1.6" class="st-fill"></rect><rect y="1.1" width="1.6" height="0.5" class="st-row"></rect></pattern></defs><path class="stand" fill="url(#rows${i})" d="${piecesD(bk.pieces,true)}"></path>`;
  });
  const PT=R&&R.pit;
  if(PT){
    const pw=PT.width,dp=rr.pit.depth,bl=rr.pit.boxLen;
    let gar='',box='',car='';
    for(const bx of PT.boxes){
      gar+=rectD(V.add(bx.c,V.mul(bx.nl,dp/2+6)),bx.t,bx.nl,bl/2,6);
      box+=rectD(bx.c,bx.t,bx.nl,bl/2-0.25,dp/2);
      car+=rectD(bx.car,bx.t,bx.nl,2.4,1);
    }
    s+=`<path class="garage" d="${gar}"></path><path class="pbox" d="${box}"></path>`;
    s+=`<path class="trk pitl" stroke-width="${pw}" d="${piecesD(PT.b.pieces,false)}"></path>`;
    if(W*z>=4) s+=`<path class="carm" d="${car}"></path>`;
  }
  for(const p of doc.paths){
    if(PT&&p===PT.p) continue;
    if(p.role) continue;
    const bk=state.bakes.get(p.id);
    if(p.nodes.length===1){const n=p.nodes[0];s+=`<circle class="dot" cx="${n.x}" cy="${n.y}" r="${W/2}"></circle>`;continue;}

    const c=first!=null&&cornerOf(s,first);

  }
  if(t==='arc'){const ar=state.arc;setVal('arcLen',ar.len);setVal('arcR',ar.r);setVal('arcAng',ar.ang);setVal('arcHead',ar.heading);setLive('arcLenOut',Math.round(ar.r*ar.ang*Math.PI/180)+' m');}

    setLive('rD',Math.abs(d[0]).toFixed(1)+' · '+Math.abs(d[1]).toFixed(1)+' m');
    setLive('rA',(Math.atan2(-d[1],d[0])*180/Math.PI).toFixed(1)+'°');
  }
  if(t==='select'&&s){const b=state.bakes.get(s.id),pc=b&&state.sel.piece!=null&&b.pieces[state.sel.piece];if(pc) setLive('selLen',pc.len.toFixed(1)+' m');}
  if(t==='pen'&&state.penPath){const ap=getPath(state.penPath);setLive('pts',ap?ap.nodes.length:0);}
  if(t==='width'&&state.race&&state.wsel!=null){
    const k=state.doc.race.widths[state.wsel];

      setLive('pitNote',R.pit.fits?'':'The boxes need about '+Math.round(R.pit.need)+' m of pit lane. Lengthen the lane, shorten the boxes or reduce the cars.');}

$('ctx').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-act]'); if(!btn) return;
  const act=btn.dataset.act,s=selPath();
  if(act==='finish'){state.penPath=null;}
  else if(act==='closePath'){const ap=getPath(state.penPath);if(ap&&ap.nodes.length>=3){ap.closed=true;state.penPath=null;commit();}}
  else if(act==='closePath2'){if(s&&s.nodes.length>=3){s.nodes[s.nodes.length-1].ho=null;s.nodes[0].hi=null;s.closed=true;commit();}}
  else if(act==='corner'||act==='smooth'){
    const i=[...state.sel.nodes][0],n=s&&s.nodes[i];if(!n) return;
    if(act==='corner'){n.smooth=false;}
    else{ if(n.hi&&n.ho){const a=[n.x,n.y],dir=V.norm(V.sub(n.ho,n.hi));n.hi=V.sub(a,V.mul(dir,V.dist(a,n.hi)));n.ho=V.add(a,V.mul(dir,V.dist(a,n.ho)));n.smooth=true;} else convertSmooth(s,i); }
    commit();
  }
  else if(act==='roundSel'||act==='roundAll'){
    if(!s) return; const b=state.bakes.get(s.id),R=Math.max(0,+$('roundR').value||0);state.roundR=R;
    const js=act==='roundAll'?Object.keys(b.corners).map(Number):[...state.sel.nodes].filter(j=>b.corners[j]);
    js.forEach(j=>{s.nodes[j].r=R;});
    if(act==='roundAll') state.sel.nodes=new Set(js);
    commit();
  }
  else if(act==='dirL'||act==='dirR'){state.arc.dir=act==='dirL'?'left':'right';state.arc.ghost='arc';}
  else if(act==='addStraight'){if(s&&!s.closed){applyStraight(s,Math.max(1,state.arc.len));state.sel.nodes=new Set([s.nodes.length-1]);state.arc.ghost='straight';commit();}}
  else if(act==='addArc'){if(s&&!s.closed){applyArc(s,Math.max(1,state.arc.r),clamp(state.arc.ang,1,359),state.arc.dir);state.sel.nodes=new Set([s.nodes.length-1]);commit();}}
  else if(act==='clearRuler'){state.ruler=null;}
  else if(act==='lineAdd'){lineAddTyped();return;}
  else if(act.startsWith('rt:')){state.raceTab=act.slice(3);}
  else if(act.startsWith('wsel:')){state.wsel=+act.slice(5);}
  else if(act==='wdesel'){state.wsel=null;}
  else if(act==='wdel'){const r=state.doc.race;if(state.wsel!=null&&r.widths[state.wsel]){r.widths.splice(state.wsel,1);state.wsel=null;commit();}}
  else if(act==='wclear'){state.doc.race.widths=[];state.wsel=null;commit();}
  else if(act.startsWith('wease:')){const k=state.doc.race.widths[state.wsel];if(k){k.ease=act.slice(6);commit();}}
  else if(act==='drsAdd'){if(autoDrs()) commit(); else toast(state.doc.race.drs.length>=4?'Four DRS zones is the maximum.':'There’s no straight of 250 m or more without a zone.');}
  else if(act.startsWith('drsDel:')){state.doc.race.drs.splice(+act.slice(7),1);commit();}
  else if(act.startsWith('roType:')){state.doc.race.runoff.type=act.slice(7);commit();}
  else if(act==='makeRace'){if(s) makeRaceTrack(s);}
  else if(act==='makePit'){if(s) makePitLane(s);}
  else if(act==='unPit'){state.doc.race.pit.path=null;state.doc.race.pit.centre=null;commit();}
  else if(act==='poleAuto'||act==='poleL'||act==='poleR'){state.doc.race.grid.pole={poleAuto:'auto',poleL:'left',poleR:'right'}[act];commit();}
  else if(act==='pitFlip'){state.doc.race.pit.flipSide=!state.doc.race.pit.flipSide;commit();}
  else if(act==='pitCentre'){state.doc.race.pit.centre=null;commit();}
  else if(act.startsWith('race')||act==='startStraight'||act==='sectorThirds'){
    const R=state.race,r=state.doc.race; if(!R) return;
    if(act==='raceCW') r.reversed=!R.cwGeo;
    else if(act==='raceCCW') r.reversed=R.cwGeo;
    else if(act==='raceFwd') r.reversed=false;
    else if(act==='raceRev') r.reversed=true;
    else if(act==='startStraight'){
      let best=-1,bl=0;R.b.pieces.forEach((pc,k)=>{if(pc.line&&pc.len>bl){bl=pc.len;best=k;}});
      if(best<0){toast('There is no straight to put it on yet.');return;}
      const a=R.line.pk[best],e2=(best+1<R.line.pk.length?R.line.pk[best+1]:R.L);
      r.start=lineAt(R.line,R.rev?e2-0.65*(e2-a):a+0.65*(e2-a)).pt;
    }else if(act==='sectorThirds') placeThirds(R,r);
    commit();
  }
  render();
});
function placeThirds(R,r){
  const f=R.rev?-1:1;
  r.sectors=[lineAt(R.line,R.s0+f*R.L/3).pt,lineAt(R.line,R.s0+f*2*R.L/3).pt];

$('ctx').addEventListener('input',e=>{

    else if(act==='boxLen'){if(v<6) return;r.pit.boxLen=clamp(v,6,40);}
    markDirty();render();return;
  }
  if(act==='wL'||act==='wR'){const v=parseFloat(el.value),k=state.doc.race&&state.doc.race.widths[state.wsel];if(!k||!isFinite(v)||v<0.5) return;const c=clamp(v,0.5,40);if(k.link){k.l=c;k.r=c;}else k[act==='wL'?'l':'r']=c;markDirty();render();return;}
  if(act==='turnMin'){const v=parseFloat(el.value);if(isFinite(v)&&v>=1&&v<=90&&state.doc.race){state.doc.race.turnMin=v;markDirty();render();}return;}
  const v=parseFloat(el.value); if(!isFinite(v)) return;
  const s=selPath();
  if(el.id==='lineLen'){const v2=parseFloat(el.value);if(isFinite(v2)&&v2>0) state.lineLen=v2;return;}
  if(el.dataset.ghost) state.arc.ghost=el.dataset.ghost;
  if(act==='arcLen') state.arc.len=v;
  else if(act==='arcR') state.arc.r=v;
  else if(act==='arcAng') state.arc.ang=v;
  else if(act==='arcHead') state.arc.heading=v;
  else if(act==='roundR'){state.roundR=Math.max(0,v);if(s){const b=state.bakes.get(s.id);for(const j of state.sel.nodes) if(b.corners[j]) s.nodes[j].r=Math.max(0,v);markDirty();}}
  else if(s){
    const i=[...state.sel.nodes][0],n=s.nodes[i]; if(!n) return;
    if(act==='ptX') moveNode(n,[v-n.x,0]);
    else if(act==='ptY') moveNode(n,[0,-v-n.y]);
    else if(act==='ptR') n.r=Math.max(0,v);
    markDirty();
  }
  render();
});

window.addEventListener('keydown',e=>{
  const tag=e.target&&e.target.tagName;
  const typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if(typing&&e.key==='Enter'&&(e.target.id==='lineLen'||e.target.id==='lineAng')){e.preventDefault();lineAddTyped();setTimeout(()=>{const el=$(e.target.id);if(el){el.focus();el.select();}},0);return;}
  if(typing){if(e.key==='Escape'||(e.key==='Enter'&&e.target.classList.contains('name'))) e.target.blur();return;}
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
  if(mod&&e.key==='0'){e.preventDefault();fit();return;}
  if(mod&&(e.key==='='||e.key==='+')){e.preventDefault();zoomCenter(1.25);return;}
  if(mod&&e.key==='-'){e.preventDefault();zoomCenter(0.8);return;}
  if(e.key==='Control'||e.key==='Meta'){state.mod=true;ctxKey='';updateCursor();render();return;}
  if(e.key==='Alt'){state.alt=true;if(state.cursorS) updateHover(state.cursorS);render();return;}
  if(e.key===' '){e.preventDefault();if(!state.space){state.space=true;updateCursor();render();}return;}
  if(mod) return;
  if(e.target&&e.target.closest&&e.target.closest('.lib')) return;
  const map={v:'select',a:'direct',p:'pen',l:'line',r:'arc',c:'round',x:'split',t:'race',m:'measure',w:'width'};
  const k=e.key.toLowerCase();
  if(map[k]&&!e.altKey){setTool(map[k]);return;}
  if(e.key==='Escape'||e.key==='Enter'){
    if(state.penPath){state.penPath=null;}
    else if(e.key==='Escape'){if(state.ruler) state.ruler=null; else {state.sel.nodes=new Set();state.sel.piece=null;}}
    closeLib(); render(); return;
  }
  if(e.key==='Delete'||e.key==='Backspace'){
    e.preventDefault();
    if(effTool()==='width'){const r=state.doc.race;if(r&&state.wsel!=null&&r.widths[state.wsel]){r.widths.splice(state.wsel,1);state.wsel=null;commit();render();}return;}
    const s=selPath(); if(!s) return;
    const t=effTool();
    if(t==='round'){for(const j of state.sel.nodes) s.nodes[j].r=0;commit();render();return;}
    if(t!=='select'&&state.sel.nodes.size){
      deleteNodes(s,state.sel.nodes);
      if(state.penPath&&!getPath(state.penPath)) state.penPath=null;
      commit();render();return;
    }
    state.doc.paths=state.doc.paths.filter(p=>p!==s);
    state.sel={path:null,nodes:new Set(),piece:null};state.penPath=null;commit();render();return;
  }
  if(e.key.startsWith('Arrow')){
    const s=selPath(); if(!s) return;
    e.preventDefault();
    const st=e.shiftKey?10:1,d={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
    const idx=state.sel.nodes.size&&effTool()!=='select'?[...state.sel.nodes]:s.nodes.map((_,i)=>i);
    idx.forEach(i=>s.nodes[i]&&moveNode(s.nodes[i],d));
    commit();render();return;
  }
  if(e.key==='='||e.key==='+'){zoomCenter(1.25);return;}
  if(e.key==='-'){zoomCenter(0.8);return;}
});

function slug(n){return (n||'circuit').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'circuit';}
function shapesSVG(){
  const fills={grass:'#CFE3BF',gravel:'#E5D8B4',tarmac:'#B9B9B4',sand:'#EEDFB8'},walls={concrete:['#7A7A74',0.8],armco:['#9A9A96',0.4],tyres:['#D4231A',1.2],fence:['#5C5C5A',0.2]};

    else if(p.role==='wall'){const k=walls[p.kind]||walls.concrete;w+=`    <path d="${d}" fill="none" stroke="${k[0]}" stroke-width="${k[1]}" data-kind="${p.kind}"/>\n`;}

  }
  let out='';
  const R=state.race,r=state.doc.race,W=state.doc.width,pd=pts=>polyD(pts.map(q=>[+q[0].toFixed(2),+q[1].toFixed(2)]));
  if(g) out+=`  <g id="surfaces">\n${g}  </g>\n`;
  if(R){
  const ROs=runoffShapes(R,r.runoff,W);
    if(ROs.length){
      out+=`  <g id="runoff">\n`;
      for(const o of ROs){
        if(o.gravel) out+=`    <path id="gravel-T${o.turn}" d="${pd(o.gravel)} Z" fill="#E5D8B4" data-surface="gravel"/>\n`;
        if(o.tarmac) out+=`    <path id="runoff-T${o.turn}" d="${pd(o.tarmac)} Z" fill="#B9B9B4" data-surface="tarmac"/>\n`;
      }
      out+=`  </g>\n`;
      if(r.runoff.barriers) out+=`  <g id="barriers" fill="none" stroke="#D4231A" stroke-width="1.2" data-kind="tyres">\n${ROs.map(o=>`    <path d="${pd(o.edge)}" data-turn="T${o.turn}"/>\n`).join('')}  </g>\n`;
    }
    }
  return {ground:out,top:(w?`  <g id="walls">\n${w}  </g>\n`:'')+(st?`  <g id="grandstands">\n${st}  </g>\n`:'')};
}
function raceSVG(W){

  let out='';
  if(r.start) out+=`  <g id="start-finish" stroke="#FFFFFF" stroke-width="1">\n${across(R.s0,'start')}  </g>\n`;

  const f2=q=>(+q[0].toFixed(2))+','+(+q[1].toFixed(2));

  return out;
}
function buildSVG(){
  const doc=state.doc,W=doc.width;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity,body='',cl='',surf='',lap=0;
  const bakes=doc.paths.map(p=>({p,b:bake(p)})).filter(o=>o.p.nodes.length>=2);
  for(const {p,b} of bakes){
    for(const pc of b.pieces) for(const q of samplePiece(pc)){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1]);}
    const d=piecesD(b.pieces,p.closed);
    if(state.race&&state.race.pit&&state.race.pit.p===p) continue;
    if(p.role) continue;
    cl+=`    <path d="${d}"/>\n`;
    if(state.race&&state.race.varW&&state.race.p===p){surf+=`    <path d="${trackOutline(state.race,1).d}" fill-rule="evenodd" data-varying-width="true"/>\n`;}
    else body+=`    <path d="${d}"/>\n`;
    if(p.closed&&!lap) lap=b.total;
  }
  if(!isFinite(x0)) return null;
  const shapes=shapesSVG();
  const ro=state.doc.race&&state.doc.race.runoff,m=W/2+10+(ro&&ro.on?ro.depth:0),vx=+(x0-m).toFixed(2),vy=+(y0-m).toFixed(2),vw=+(x1-x0+2*m).toFixed(2),vh=+(y1-y0+2*m).toFixed(2);
  return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${vw}" height="${vh}" viewBox="${vx} ${vy} ${vw} ${vh}">
  <title>${esc(doc.name)}</title>
  <desc>Scale: 1 unit = 1 metre. Track width ${state.race&&state.race.varW?'varies ('+widthRange(state.race).map(v=>v.toFixed(1)).join('–')+' m)':W+' m'}.${lap?' Lap length '+lap.toFixed(1)+' m.':''} ${state.race&&state.race.closed?' Runs '+(state.race.clockwise?'clockwise':'anticlockwise')+'.':''} Drawn in Circuit Track Editor.</desc>
${shapes.ground}${surf?`  <g id="track-surface" fill="#111111" stroke="none">\n${surf}  </g>\n`:''}  <g id="track" fill="none" stroke="#111111" stroke-width="${W}" stroke-linejoin="round" stroke-linecap="round">
${body}  </g>
  <g id="centreline" fill="none" stroke="#D4231A" stroke-width="0.5">
${cl}  </g>
${shapes.top}${raceSVG(W)}</svg>
`;
}
/* ---------------- Track Pack ----------------

   timing lines, grid, pit lane and boxes, kerbs, run-off, DRS, walls, surfaces and the reference layers. */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function zipStore(files){

    const head=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);

    cdir.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=head.length+name.length+data.length;
  }
  const csize=cdir.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(off),...u16(0)]);

      centreline:pl,boxes:PT.boxes.map(b=>({n:b.n,x:r2(b.car[0]),y:r2(b.car[1]),z:pp?r2(pp.at(lineProject(PT.line,b.car).s)):0,heading:[r3(b.t[0]),r3(b.t[1])],side:[r3(b.nl[0]),r3(b.nl[1])]}))};

async function offer(filename,data,label){
  if(!downloads&&!window.claude){
    const ext=filename.split('.').pop(),url=URL.createObjectURL(new Blob([data],{type:ext==='svg'?'image/svg+xml':ext==='zip'?'application/zip':'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);return;
  }
  if(!downloads){
    if(typeof data!=='string'){toast('Downloads aren’t available in this view. Open the editor in a browser tab to export the Track Pack.');return;}
    try{await navigator.clipboard.writeText(data);toast('Downloads aren’t available here, so the '+label+' was copied to your clipboard.');}
    catch(_){toast('Downloads aren’t available in this view.');}
    return;
  }
  try{await downloads.save({filename,data});}
  catch(err){
    const c=err&&err.code;
    if(c==='declined') return;
    if(c==='rate_limited'){toast('A save prompt is already open.');return;}
    toast('That file couldn’t be saved here.');
  }
}
